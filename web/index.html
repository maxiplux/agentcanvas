// ===== Section 1: Constants & helpers =====
const { useState, useEffect, useLayoutEffect, useRef, useMemo, useCallback, memo, createContext, useContext, Fragment } = React;

const ORDER = ['xs', 'sm', 'md', 'lg', 'xl', 'display'];
const COLOR_KEYS = ['paper', 'ink', 'muted', 'accent', 'wash', 'line'];
const SPACE = [0, 4, 8, 16, 24, 32, 48, 64];
const BREAKPOINTS = { desktop: 1280, tablet: 768, phone: 390 };

const CH = { bar: '#1C1B19', barText: '#F4F2EC', panel: '#FFFFFF', hair: '#E3E0D9', backdrop: '#F3F2EF', ink: '#1C1B19', muted: '#7A766D', faint: '#A8A49B', edge: '#8E8A80', stage: '#141311' };

const PHONE_W = 390, PHONE_H = 844;
const THUMB = { web: { w: 220, h: 140 }, mobile: { w: 110, h: 220 } };
const LANE = { gap: 64, laneGap: 56, left: 32, head: 30 };
const TAB_CHANNEL = { web: 'web', story: 'mobile' };
const CHANNEL_TAB = { web: 'web', mobile: 'story' };
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
const MOD = isMac ? '⌘' : 'Ctrl+';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const slug = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g, '').trim().replace(/[\s_-]+/g, '-') || 'untitled';

// §9.1 type step-down
function effectiveRole(role, bp) {
  const i = ORDER.indexOf(role);
  if (bp === 'tablet' && i >= 4) return ORDER[i - 1];
  if (bp === 'phone' && i >= 3) return ORDER[Math.max(0, i - 1)];
  return role;
}
function effectivePad(padIdx, bp) { return bp === 'phone' ? Math.max(3, padIdx - 1) : padIdx; }

// §9.6 snap
const snap = (v, on) => (on ? Math.round(v / 8) * 8 : v);
const ctaHeight = s => ({ sm: 36, md: 44, lg: 52 }[s] || 44);
const col = (tokens, key) => (key === 'none' ? 'none' : tokens.colors[key] || '#000');

function typeStyle(tokens, role, weight) {
  const t = tokens.type[role] || tokens.type.md;
  return { fontFamily: SERIF, fontSize: t.size, lineHeight: t.lh + 'px', fontWeight: weight || t.weight };
}
const specOf = (tokens, role) => { const t = tokens.type[role] || tokens.type.md; return `${t.size}/${t.lh}`; };

// §9.5 storyboard BFS order
function laneOrder(flow, nodes, edges) {
  const inFlow = nodes.filter(n => n.flowId === flow.id);
  const seen = new Set(), out = [];
  const q = flow.startId ? [flow.startId] : [];
  while (q.length) {
    const id = q.shift(); if (seen.has(id)) continue;
    const n = inFlow.find(n => n.id === id); if (!n) continue;
    seen.add(id); out.push(n);
    edges.filter(e => e.fromId === id && e.kind !== 'back').forEach(e => q.push(e.toId));
  }
  inFlow.forEach(n => { if (!seen.has(n.id)) out.push(n); });
  return out;
}

function downloadExport(kind, query) {
  const qs = query ? '?' + new URLSearchParams(query).toString() : '';
  const a = document.createElement('a');
  a.href = `/api/export/${kind}${qs}`;
  a.download = '';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function isTyping(el) {
  if (!el) return false;
  const t = el.tagName;
  return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || el.isContentEditable;
}
const stripFrontmatter = md => md.replace(/^---\n[\s\S]*?\n---\n?/, '');
const wordCount = md => (md.match(/\S+/g) || []).length;
const firstLine = s => String(s || '').split('\n')[0];
const nodeChannel = n => (n.kind === 'screen' ? 'mobile' : 'web');

// §8.6 minimal, safe markdown renderer (never dangerouslySetInnerHTML)
function renderInline(text, kb) {
  const out = []; const re = /(\*\*([^*]+)\*\*|\*([^*\s][^*]*?)\*|`([^`]+)`)/g;
  let last = 0, m, i = 0;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[2] != null) out.push(<strong key={kb + 'b' + i++}>{m[2]}</strong>);
    else if (m[3] != null) out.push(<em key={kb + 'i' + i++}>{m[3]}</em>);
    else out.push(<code key={kb + 'c' + i++}>{m[4]}</code>);
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function renderMd(md) {
  const lines = String(md || '').split('\n'); const out = []; let i = 0;
  const isUl = l => /^\s*[-*]\s+/.test(l), isOl = l => /^\s*\d+\.\s+/.test(l), isH = l => /^#{1,3}\s+/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    if (h) { const Tag = 'h' + h[1].length; out.push(<Tag key={'h' + i} id={'md-line-' + i} data-line={i}>{renderInline(h[2], 'h' + i)}</Tag>); i++; continue; }
    if (isUl(line) || isOl(line)) {
      const ordered = isOl(line), start = i, items = [];
      while (i < lines.length && (ordered ? isOl(lines[i]) : isUl(lines[i]))) { items.push(lines[i].replace(ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/, '')); i++; }
      const Tag = ordered ? 'ol' : 'ul';
      out.push(<Tag key={'l' + start}>{items.map((t, k) => <li key={k}>{renderInline(t, 'l' + start + '-' + k)}</li>)}</Tag>);
      continue;
    }
    const start = i, para = [];
    while (i < lines.length && lines[i].trim() && !isH(lines[i]) && !isUl(lines[i]) && !isOl(lines[i])) { para.push(lines[i].trim()); i++; }
    out.push(<p key={'p' + start}>{renderInline(para.join(' '), 'p' + start)}</p>);
  }
  return out;
}
function mdHeadings(md) {
  const out = [];
  String(md || '').split('\n').forEach((l, i) => { const m = /^(#{1,3})\s+(.*)$/.exec(l); if (m) out.push({ level: m[1].length, text: m[2].trim(), line: i }); });
  return out;
}

// project lookups
const findNode = (p, id) => p.nodes.find(n => n.id === id) || null;
const findFlow = (p, id) => p.flows.find(f => f.id === id) || null;
function linkOwners(node) {
  // every link-like owner on a node: {key, id, label, toId, owner, blockId}
  const out = [];
  if (node.kind === 'page') {
    node.blocks.forEach(b => {
      (b.links || []).forEach(l => out.push({ id: l.id, label: l.label, toId: l.toId, blockId: b.id, owner: { blockId: b.id, childId: l.id } }));
      if (b.type === 'hero' && b.cta) out.push({ id: b.cta.id, label: b.cta.label, toId: b.cta.toId, blockId: b.id, owner: { blockId: b.id, field: 'cta' } });
      if (b.type === 'hero' && b.secondary) out.push({ id: b.secondary.id, label: b.secondary.label, toId: b.secondary.toId, blockId: b.id, owner: { blockId: b.id, field: 'secondary' } });
      if (b.type === 'cta' && b.button) out.push({ id: b.button.id, label: b.button.label, toId: b.button.toId, blockId: b.id, owner: { blockId: b.id, field: 'button' } });
    });
  } else {
    if (node.cta) out.push({ id: 'cta', label: node.cta.label, toId: node.cta.toId, owner: { cta: true } });
    node.hotspots.forEach(h => out.push({ id: h.id, label: h.label, toId: h.toId, owner: { hotspotId: h.id } }));
  }
  return out;
}

// ===== Section 2: Sync =====
const Studio = createContext(null);
const useS = () => useContext(Studio);

// structural sharing: keep previous objects that did not change so memoized components skip work
function share(prev, next) {
  if (prev === next) return prev;
  if (!prev || !next || typeof prev !== 'object' || typeof next !== 'object' || Array.isArray(prev) !== Array.isArray(next)) return next;
  let same = true, out;
  if (Array.isArray(next)) {
    const byId = next.length && next[0] && typeof next[0] === 'object' && 'id' in next[0] ? new Map(prev.map(x => [x && x.id, x])) : null;
    out = next.map((v, i) => {
      const p = byId && v && typeof v === 'object' ? byId.get(v.id) : prev[i];
      const s = share(p, v);
      if (s !== prev[i]) same = false;
      return s;
    });
    if (prev.length !== next.length) same = false;
  } else {
    out = {};
    const nk = Object.keys(next);
    if (nk.length !== Object.keys(prev).length) same = false;
    for (const k of nk) { const s = share(prev[k], next[k]); out[k] = s; if (s !== prev[k]) same = false; }
  }
  return same ? prev : out;
}

function useStudio() {
  const [state, setState] = useState(null);
  const [conn, setConn] = useState('connecting');
  const [toast, setToast] = useState(null);
  const [agent, setAgent] = useState(null);
  const [activity, setActivity] = useState([]); // newest first, capped at 200
  const [epoch, setEpoch] = useState(0);
  const stRef = useRef(null), resync = useRef(true), syncRev = useRef(0);
  const toastT = useRef(0), agentT = useRef(0);
  const queue = useRef([]), running = useRef(false);

  const showToast = useCallback((msg, ms = 4000) => {
    setToast({ msg, at: Date.now() });
    clearTimeout(toastT.current);
    toastT.current = setTimeout(() => setToast(null), ms);
  }, []);

  const accept = useCallback(next => {
    const cur = stRef.current;
    if (!resync.current && cur && next.rev <= cur.rev) return;
    resync.current = false;
    const { source, summary, ...st } = next;
    const merged = share(cur, st);
    stRef.current = merged;
    setState(merged);
    if (syncRev.current && next.rev >= syncRev.current) { syncRev.current = 0; setEpoch(e => e + 1); }
    if (summary) setActivity(a => [{ rev: next.rev, source: source || 'ui', summary, at: Date.now() }, ...a].slice(0, 200));
    if (source === 'mcp' && summary) {
      setAgent(summary);
      clearTimeout(agentT.current);
      agentT.current = setTimeout(() => setAgent(null), 3000);
    }
  }, []);

  useEffect(() => {
    let es = null, timer = 0, delay = 500, dead = false;
    const open = () => {
      es = new EventSource('/api/events');
      es.addEventListener('state', e => { try { accept(JSON.parse(e.data)); } catch (err) { /* ignore malformed frame */ } });
      es.onopen = async () => {
        try {
          const r = await fetch('/api/state');
          const st = await r.json();
          resync.current = true;
          accept(st);
          setConn('live');
          delay = 500;
        } catch (err) { /* the error handler reconnects */ }
      };
      es.onerror = () => {
        es.close();
        if (dead) return;
        resync.current = true;
        setConn('reconnecting');
        clearTimeout(timer);
        timer = setTimeout(open, delay);
        delay = Math.min(delay * 2, 5000);
      };
    };
    open();
    return () => { dead = true; if (es) es.close(); clearTimeout(timer); };
  }, [accept]);

  const send = useCallback(async body => {
    let res;
    try {
      const r = await fetch('/api/act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      res = await r.json();
    } catch (err) { res = { ok: false, error: 'The AgentCanvas server is unreachable.' }; }
    if (!res.ok) showToast(res.error || 'Refused');
    else if (body.type === 'undo' || body.type === 'redo') {
      if (stRef.current && stRef.current.rev >= res.rev) setEpoch(e => e + 1); else syncRev.current = res.rev;
    }
    return res;
  }, [showToast]);

  const pump = useCallback(async () => {
    if (running.current) return;
    running.current = true;
    while (queue.current.length) {
      const it = queue.current.shift();
      const res = await send(it.body);
      it.done.forEach(f => f(res));
    }
    running.current = false;
  }, [send]);

  // act(type, payload, {tab, coalesce, commit}) — serialized so keystrokes arrive in order
  const act = useCallback((type, payload = {}, opts = {}) => new Promise(resolve => {
    const cur = stRef.current;
    const body = { type, payload, tab: opts.tab || (cur ? cur.view.tab : 'web') };
    if (opts.coalesce) body.coalesce = opts.coalesce;
    if (opts.commit) body.commit = true;
    const last = queue.current[queue.current.length - 1];
    if (opts.coalesce && last && !last.body.commit && last.body.type === type && last.body.coalesce === opts.coalesce) {
      last.body = body; last.done.push(resolve);
    } else {
      queue.current.push({ body, done: [resolve] });
    }
    pump();
  }), [pump]);

  return { state, conn, toast, agent, activity, epoch, act, showToast };
}

// A text field that keeps a local draft while focused (§12.2): sends one action per
// animation frame with a coalesce key, and commit on blur.
function useDraft(value, send, coalesce) {
  const { epoch } = useS();
  const [draft, setDraft] = useState(value);
  const focused = useRef(false), dirty = useRef(false), raf = useRef(0), latest = useRef(value);
  useEffect(() => { if (!focused.current) { setDraft(value); latest.current = value; } }, [value]);
  useEffect(() => { setDraft(value); latest.current = value; }, [epoch]); // undo/redo wins over drafts
  useEffect(() => () => cancelAnimationFrame(raf.current), []);
  const onChange = v => {
    setDraft(v); latest.current = v; dirty.current = true;
    if (!raf.current) raf.current = requestAnimationFrame(() => { raf.current = 0; send(latest.current, { coalesce }); });
  };
  const flush = () => {
    if (raf.current) { cancelAnimationFrame(raf.current); raf.current = 0; }
    if (dirty.current) { dirty.current = false; send(latest.current, { coalesce, commit: true }); }
  };
  return { draft, onChange, onFocus: () => { focused.current = true; }, onBlur: () => { focused.current = false; flush(); }, flush };
}

// ===== Section 3: Primitives =====
function Seg({ options, value, onChange, disabled, small }) {

function Field({ label, children, hint, row }) {

const inputCls = 'w-full rounded border border-[#DDD5C4] bg-white px-2 py-1 text-[12px] outline-none focus:border-[#D8432A] disabled:opacity-50';

// TextInput: draft-aware (§12.2). onSend(value, {coalesce, commit})
function TextInput({ value, onSend, coalesce, multiline, rows, placeholder, disabled, onEnter, autoFocus, className }) {
  const d = useDraft(value || '', onSend, coalesce);
  const props = {
    value: d.draft, disabled, placeholder, autoFocus,
    onChange: e => d.onChange(e.target.value), onFocus: d.onFocus, onBlur: d.onBlur,
    className: (className || inputCls),
    onKeyDown: e => {
      if (e.key === 'Enter' && !multiline) { d.flush(); if (onEnter) onEnter(); e.currentTarget.blur(); }
      if (e.key === 'Escape') { e.stopPropagation(); e.currentTarget.blur(); }
    },
  };
  return multiline ? <textarea rows={rows || 3} {...props} /> : <input type="text" {...props} />;
}

function NumberInput({ value, onCommit, min, max, step, disabled, width }) {
  const [d, setD] = useState(String(value));
  const focused = useRef(false);
  useEffect(() => { if (!focused.current) setD(String(value)); }, [value]);
  const commit = () => { const n = Number(d); if (Number.isFinite(n) && n !== value) onCommit(clamp(n, min ?? -1e9, max ?? 1e9)); else setD(String(value)); };
  return (
    <input type="number" value={d} min={min} max={max} step={step || 1} disabled={disabled}
      onFocus={() => { focused.current = true; }} onBlur={() => { focused.current = false; commit(); }}
      onChange={e => setD(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); if (e.key === 'Escape') { e.stopPropagation(); setD(String(value)); e.currentTarget.blur(); } }}
      className={inputCls + ' tabular-nums'} style={{ width: width || 64 }} />
  );
}

function IconButton({ title, onClick, children, active, disabled, dark, className }) {

function Pill({ children, tone }) {

function Section({ title, children, right }) {

// Popover anchored at (x, y) in its positioned parent; Esc and outside click close it.
function Popover({ x, y, onClose, children, width }) {
  const ref = useRef(null);
  useEffect(() => {
    const down = e => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    const t = setTimeout(() => window.addEventListener('pointerdown', down), 0);
    return () => { clearTimeout(t); window.removeEventListener('pointerdown', down); };
  }, [onClose]);
  return (
    <div ref={ref} onClick={e => e.stopPropagation()} onPointerDown={e => e.stopPropagation()}
      onKeyDown={e => { if (e.key === 'Escape') { e.stopPropagation(); onClose(); } }}
      className="absolute z-[60] bg-[#FBF8F2] border border-[#DDD5C4] rounded shadow-lg p-2.5 text-[12px] font-ui text-[#232220]"
      style={{ left: x, top: y, width: width || 240 }}>
      {children}
    </div>
  );
}

const dashed = { outline: `1.5px dashed ${V}`, outlineOffset: 3 };

// renderBlock(block, ctx): ctx = {tokens, bp, mode: 'edit'|'preview'|'thumb', onNavigate, selection, onSelect, nodeId, showSpecs, onChipDown}
function renderBlock(block, ctx) {
  const s = ctx.selection;
  const mine = s && s.kind === 'block' && s.blockId === block.id;
  return <BlockView key={block.id} block={block} nodeId={ctx.nodeId} tokens={ctx.tokens} bp={ctx.bp} mode={ctx.mode}
    selBlock={!!(mine && !s.childId)} selChild={mine ? s.childId || null : null} showSpecs={!!ctx.showSpecs}

const BlockView = memo(function BlockView({ block, nodeId, tokens, bp, mode, selBlock, selChild, showSpecs, onSelect, onNavigate, onChipDown }) {
  const ref = useRef(null);
  const [menu, setMenu] = useState(false);

  const phone = bp === 'phone';
  const padPx = SPACE[effectivePad(block.pad, bp)];
  const gap = SPACE[block.gap];
  const T = (role, weight) => typeStyle(tokens, effectiveRole(role, bp), weight);
  const sp = role => specOf(tokens, effectiveRole(role, bp));
  const center = block.align === 'center';

  const linkProps = (l, extraStyle) => ({
    'data-child-id': l.id,
    className: l.toId ? 'ac-link' : undefined,
    onClick: e => {
      if (edit) { e.stopPropagation(); onSelect && onSelect(nodeId, block.id, l.id); }

  const inner = { maxWidth: 1120, margin: '0 auto', display: 'flex', flexDirection: 'column', gap, textAlign: center ? 'center' : 'left', alignItems: center ? 'center' : 'stretch' };

    body = (
      <div style={{ maxWidth: 1120, margin: '0 auto' }}>

  } else if (block.type === 'hero') {
    body = (
      <div style={inner}>

            {button(block.cta, 'accent', 'paper')}

          </div>
        </div>
      </div>
    );
  } else if (block.type === 'features') {
    const cols = bp === 'desktop' ? 3 : bp === 'tablet' ? 2 : 1;
    body = (
      <div style={inner}>
        <h2 data-main data-spec={sp(block.typeRole)} style={{ ...T(block.typeRole, block.weight), margin: 0 }}>{block.heading}</h2>

          {block.items.map(it => (
            <div key={it.id} data-child-id={it.id} data-spec={sp('md')}

      </div>

  const selected = edit && (selBlock || selChild);
  return (
    <section ref={ref} data-block-id={block.id} data-node-id={nodeId}
      onClick={edit ? e => { e.stopPropagation(); onSelect && onSelect(nodeId, block.id, null); } : undefined}
      style={{ position: 'relative', background: col(tokens, block.fill), color: col(tokens, block.ink), padding: `${padPx}px ${Math.max(padPx, 24)}px`, outline: selected ? `2px solid ${V}` : 'none', outlineOffset: -2 }}>
      {body}
      {selected && (
        <div onPointerDown={e => { e.stopPropagation(); onChipDown && onChipDown(e, block.id); }} onClick={e => e.stopPropagation()}
          title="Drag to reorder"
          style={{ position: 'absolute', left: 0, top: 0, background: V, color: '#F4EFE6', font: '600 10px/18px Inter, sans-serif', padding: '0 6px', cursor: 'grab', zIndex: 30, userSelect: 'none' }}>
          {BLOCK_LABEL[block.type]}
        </div>
      )}
      {selected && showSpecs && <SpecsOverlay containerRef={ref} childId={selChild} padTop={padPx} padLeft={Math.max(padPx, 24)} gap={gap} sig={JSON.stringify(block) + bp + JSON.stringify(tokens.type)} />}

// renderScreen(screen, ctx): ctx = {tokens, mode, selection, onSelect, onTap, onHotspotEdit}
function renderScreen(screen, ctx) {
  const s = ctx.selection;
  return <ScreenView key={screen.id} screen={screen} tokens={ctx.tokens} mode={ctx.mode}
    selHotspot={s && s.kind === 'hotspot' && s.nodeId === screen.id ? s.hotspotId : null}
    onSelect={ctx.onSelect} onTap={ctx.onTap} onHotspotEdit={ctx.onHotspotEdit} />;
}

const ScreenView = memo(function ScreenView({ screen, tokens, mode, selHotspot, onSelect, onTap, onHotspotEdit }) {
  const edit = mode === 'edit', play = mode === 'preview';
  const pad = SPACE[screen.pad] ?? 24, gap = SPACE[screen.gap] ?? 16;
  const fill = col(tokens, screen.fill), ink = col(tokens, screen.ink);
  const center = screen.align === 'center';
  const quote = screen.archetype === 'quote';
  const titleText = quote ? '“' + screen.title.replace(/^[“"]+|[”"]+$/g, '') + '”' : screen.title;
  const title = <h1 data-main data-spec={specOf(tokens, screen.typeRole)} style={{ ...typeStyle(tokens, screen.typeRole, screen.weight), margin: 0 }}>{titleText}</h1>;
  const body = quote
    ? <p data-main data-spec={specOf(tokens, 'sm')} style={{ ...typeStyle(tokens, 'sm'), margin: 0, color: tokens.colors.muted }}>{screen.body}</p>
    : <p data-main data-spec={specOf(tokens, 'md')} style={{ ...typeStyle(tokens, 'md'), margin: 0 }}>{screen.body}</p>;
  const c = screen.cta;
  // SPEC: mobile CTA labels render at lg weight 600 (large text), matching the server contrast check.
  const cta = c && (
    <button type="button" data-cta="1"
      onClick={e => { e.stopPropagation(); if (play) onTap && onTap(c.toId); else if (edit) onSelect && onSelect(screen.id, null); }}
      className={c.toId ? 'ac-link' : undefined}
      style={{ height: ctaHeight(c.size), width: PHONE_W - 2 * pad, alignSelf: 'center', flex: 'none', background: col(tokens, c.fill), color: col(tokens, c.ink), border: 0, borderRadius: 4, fontFamily: SERIF, fontWeight: 600, fontSize: tokens.type.lg.size, lineHeight: 1, cursor: play ? 'pointer' : undefined }}>
      {c.label}
    </button>
  );
  const textCol = <div style={{ display: 'flex', flexDirection: 'column', gap, alignItems: center ? 'center' : 'flex-start', textAlign: center ? 'center' : 'left' }}>{title}{body}</div>;
  const area = { position: 'absolute', top: 64, bottom: 34, left: pad, right: pad, display: 'flex', flexDirection: 'column', gap };
  let content;
  if (screen.layout === 'split') {
    content = (
      <>
        <div className="ac-split-top" style={{ position: 'absolute', left: 0, right: 0, top: 0, height: PHONE_H / 2, background: tokens.colors.wash, color: tokens.colors.ink, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', padding: `0 ${pad}px ${pad}px`, textAlign: center ? 'center' : 'left' }}>{title}</div>
        <div style={{ ...area, top: PHONE_H / 2 + pad }}>{body}<div style={{ flex: 1 }} />{cta}</div>
      </>
    );
  } else if (screen.layout === 'bottom' && screen.archetype === 'cta') {
    content = <div style={area}>{textCol}<div style={{ flex: 1 }} />{cta}</div>;
  } else if (screen.layout === 'bottom') {
    content = <div style={area}><div style={{ flex: 1 }} />{textCol}{cta}</div>;
  } else {
    content = <div style={area}><div style={{ flex: 1 }} />{textCol}<div style={{ flex: 1 }} />{cta}</div>;
  }
  return (
    <div data-screen-id={screen.id} onClick={edit ? e => { e.stopPropagation(); onSelect && onSelect(screen.id, null); } : undefined}
      style={{ position: 'relative', width: PHONE_W, height: PHONE_H, background: fill, color: ink, overflow: 'hidden', fontFamily: SERIF }}>
      {screen.archetype === 'photo' && (
        <>
          <div className="ac-hatch" style={{ position: 'absolute', inset: 0, '--h1': tokens.colors.wash, '--h2': tokens.colors.line }} />
          <div style={{ position: 'absolute', inset: 0, background: `linear-gradient(180deg, transparent 35%, ${fill}E6 68%, ${fill} 100%)` }} />
        </>
      )}
      {content}
      {screen.hotspots.map(h => (
        <HotspotBox key={h.id} h={h} mode={mode} selected={selHotspot === h.id}
          onSelect={() => onSelect && onSelect(screen.id, h.id)} onTap={() => onTap && onTap(h.toId)}
          onEdit={g => onHotspotEdit && onHotspotEdit(screen.id, h.id, g)} />
      ))}
    </div>
  );
});

function HotspotBox({ h, mode, selected, onSelect, onTap, onEdit }) {
  const [drag, setDrag] = useState(null); // {x,y,w,h}
  const g = drag || h;
  if (mode === 'thumb') return null;
  if (mode === 'preview') {
    return <button type="button" data-hotspot="1" aria-label={h.label} onClick={e => { e.stopPropagation(); onTap(); }}
      style={{ position: 'absolute', left: h.x, top: h.y, width: h.w, height: h.h, background: 'transparent', border: 0, padding: 0, zIndex: 10 }} />;
  }
  const start = (e, resize) => {
    e.stopPropagation(); e.preventDefault();
    onSelect();
    const sx = e.clientX, sy = e.clientY, o = { x: h.x, y: h.y, w: h.w, h: h.h };
    let cur = o, moved = false;
    const move = ev => {
      const dx = Math.round(ev.clientX - sx), dy = Math.round(ev.clientY - sy);
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      cur = resize
        ? { ...o, w: clamp(o.w + dx, 8, PHONE_W - o.x), h: clamp(o.h + dy, 8, PHONE_H - o.y) }
        : { ...o, x: clamp(o.x + dx, 0, PHONE_W - o.w), y: clamp(o.y + dy, 0, PHONE_H - o.h) };
      setDrag(cur);
    };
    const up = () => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      if (moved) onEdit(cur);
      setTimeout(() => setDrag(null), 120);
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  return (
    <div data-hotspot-id={h.id} onPointerDown={e => start(e, false)} onClick={e => e.stopPropagation()}
      style={{ position: 'absolute', left: g.x, top: g.y, width: g.w, height: g.h, border: `1.5px dashed ${V}`, background: selected ? 'rgba(216,67,42,.12)' : 'rgba(216,67,42,.05)', zIndex: 10, cursor: 'move', touchAction: 'none' }}>
      <span style={{ position: 'absolute', left: -1, top: -17, background: V, color: '#F4EFE6', font: '600 10px/16px Inter, sans-serif', padding: '0 5px', whiteSpace: 'nowrap', pointerEvents: 'none' }}>{h.label}{h.toId ? ' ↗' : ''}</span>
      {selected && <span onPointerDown={e => start(e, true)} style={{ position: 'absolute', right: -5, bottom: -5, width: 10, height: 10, background: '#F4EFE6', border: `1.5px solid ${V}`, cursor: 'nwse-resize' }} />}
    </div>
  );
}

function useOutsideClose(open, setOpen) {
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const down = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    window.addEventListener('pointerdown', down);
    return () => window.removeEventListener('pointerdown', down);
  }, [open, setOpen]);
  return ref;
}

function TopBar() {
  const { state, act, agent, ui, setUi } = useS();
  const v = state.view, tab = v.tab, p = state.project;
  const h = state.history[tab] || {};
  const lastCanvasTab = useRef('web');
  useEffect(() => { if (tab !== 'doc') lastCanvasTab.current = tab; }, [tab]);
  const cur = findNode(p, v.entered) || (v.selection && v.selection.nodeId ? findNode(p, v.selection.nodeId) : null) || findNode(p, tab === 'story' ? v.currentNodeId.mobile : v.currentNodeId.web);
  const play = !!(cur && cur.kind === 'screen');
  return (
    <header className="h-11 flex-none flex items-center gap-2 px-3 bg-bar text-[#F4F2EC] select-none relative z-[50]">
      <span className="font-serif text-[15px] font-semibold tracking-tight pl-1">AgentCanvas</span>
      <ProjectMenu />
      <DarkSeg value={tab === 'doc' ? 'doc' : 'canvas'} onChange={x => act('set_tab', { tab: x === 'doc' ? 'doc' : lastCanvasTab.current })}
        options={[{ value: 'canvas', label: 'Canvas' }, { value: 'doc', label: 'DESIGN.md' }]} />
      <div className="flex-1" />
      {agent && (
        <span className="inline-flex items-center gap-2 h-7 px-2.5 rounded-full bg-white/[.08] text-[#D8D4CA] text-[12px] max-w-[360px]" title={agent}>
          <span className="w-[7px] h-[7px] rounded-full flex-none" style={{ background: '#5FB37A', boxShadow: '0 0 0 3px rgba(95,179,122,.25)' }} />
          <span className="truncate">{agent}</span>

      <IssueBadge />
      <BarButton title={`Undo (${MOD}Z)`} disabled={!h.canUndo} onClick={() => act('undo', { tab })}>↶</BarButton>
      <BarButton title={`Redo (${MOD}⇧Z)`} disabled={!h.canRedo} onClick={() => act('redo', { tab })}>↷</BarButton>

function useAddNode() {
  const { state, act } = useS();
  return async channel => {
    const p = state.project, v = state.view;
    const selNode = v.selection && v.selection.nodeId ? findNode(p, v.selection.nodeId) : null;
    let flow = selNode && nodeChannel(selNode) === channel ? findFlow(p, selNode.flowId) : null;
    if (!flow) flow = p.flows.find(f => f.channel === channel);
    if (!flow) { await act('upsert_flow', { channel }); return; } // a new flow comes with one node
    const res = await act('upsert_node', { flowId: flow.id, afterId: selNode && selNode.flowId === flow.id ? selNode.id : undefined });
    return res;
  };
}

function ToolRail() {
  const { state, act, ui, setUi, showToast } = useS();
  const addNode = useAddNode();
  const p = state.project, v = state.view;
  const setTool = t => setUi(u => ({ ...u, tool: t }));
  const tidy = () => {
    const selNode = v.selection && v.selection.nodeId ? findNode(p, v.selection.nodeId) : null;
    const placed = fid => p.nodes.some(n => n.flowId === fid && n.pos);
    if (selNode && placed(selNode.flowId)) { act('tidy_flow', { flowId: selNode.flowId }); return; }
    const flows = p.flows.filter(f => placed(f.id));
    if (!flows.length) { showToast('Nothing to tidy: every artboard is already in its lane.'); return; }
    if (window.confirm(`Tidy ${flows.length} flow${flows.length === 1 ? '' : 's'}? Every artboard returns to the automatic layout.`)) flows.forEach(f => act('tidy_flow', { flowId: f.id }));
  };
  const groups = [
    [['select', 'Select', 'V', () => setTool('select')], ['hand', 'Hand', 'H', () => setTool('hand')]],
    [['page', 'Add web page', 'N', () => addNode('web')], ['screen', 'Add mobile screen', 'M', () => addNode('mobile')]],
    [['rect', 'Rectangle', 'R', () => setTool('rect')], ['ellipse', 'Ellipse', 'O', () => setTool('ellipse')], ['line', 'Line', 'L', () => setTool('line')], ['arrow', 'Arrow', 'A', () => setTool('arrow')], ['pen', 'Pen', 'P', () => setTool('pen')], ['text', 'Text', 'T', () => setTool('text')]],
    [['pin', 'Pin a note', 'C', () => setTool(ui.tool === 'pin' ? 'select' : 'pin')], ['tidy', 'Tidy layout', '⇧T', tidy]],
  ];
  const tools = new Set(['select', 'hand', 'rect', 'ellipse', 'line', 'arrow', 'pen', 'text', 'pin']);
  return (
    <>
      <nav className="ac-float" style={{ position: 'absolute', right: 14, top: '50%', transform: 'translateY(-50%)', width: 44, padding: 6, display: 'flex', flexDirection: 'column', gap: 2, zIndex: 30 }}>
        {groups.map((g, gi) => (
          <Fragment key={gi}>
            {gi > 0 && <hr className="border-0 border-t border-hair my-1 mx-0.5" />}
            {g.map(([name, label, key, fn]) => (
              <button key={name} type="button" data-tool={name} onClick={fn} className={'ac-ibtn ac-tip-host' + (tools.has(name) && ui.tool === name ? ' on' : '')}>
                <Icon name={name} />
                <span className="ac-tip" style={{ right: 42, top: '50%', transform: 'translateY(-50%)' }}>{label}<kbd>{key}</kbd></span>
              </button>
            ))}
          </Fragment>
        ))}
      </nav>
      {ui.tool === 'pin' && (
        <div className="ac-float font-ui" style={{ position: 'absolute', right: 66, top: '50%', transform: 'translateY(-50%)', padding: 4, display: 'flex', flexDirection: 'column', gap: 2, zIndex: 30 }}>
          {PIN_KINDS.map(k => (
            <button key={k} type="button" onClick={() => setUi(u => ({ ...u, pinKind: k }))}
              className={'h-7 px-2.5 rounded-md text-[12px] text-left inline-flex items-center gap-2 ' + (ui.pinKind === k ? 'bg-ink text-white' : 'text-ink hover:bg-[#F3F2EF]')}>
              <span className="w-4 text-center font-semibold">{PIN_GLYPH[k]}</span>{PIN_NAME[k]}
            </button>
          ))}
        </div>
      )}
    </>
  );
}

          <button key={t} type="button" onClick={() => pick(t)}
            className={'relative px-2.5 h-8 text-[12px] font-medium rounded-t-lg ' + (ui.leftTab === t ? 'text-ink' : 'text-muted hover:text-ink')}>
            {l}{n ? <span className="ml-1.5 text-[11px] font-semibold text-accent">{n}</span> : null}
            {ui.leftTab === t && <span className="absolute left-2 right-2 -bottom-px h-0.5 bg-ink rounded" />}
          </button>
        ))}
        <div className="flex-1" />
        <button type="button" className="ac-ibtn ac-tip-host mb-0.5" style={{ width: 26, height: 26 }} onClick={() => setUi(u => ({ ...u, leftOpen: false }))}>
          <svg className="ac-icon" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg><span className="ac-tip" style={{ left: 30, top: '50%', transform: 'translateY(-50%)' }}>Collapse<kbd>{MOD}\</kbd></span>
        </button>
      </div>
      <div className="flex-1 min-h-0 overflow-auto ac-scroll">
        {ui.leftTab === 'layers' ? <Layers /> : ui.leftTab === 'activity' ? <Activity /> : <ReviewPanel />}
      </div>
      <PromptComposer />
    </aside>
  );
}

function LayerRow({ depth, on, dim, onClick, onDoubleClick, children, draggable, onDragStart, onDragOver, onDrop, onDragEnd, dataAttr }) {
  return (
    <div {...(dataAttr || {})} draggable={draggable} onDragStart={onDragStart} onDragOver={onDragOver} onDrop={onDrop} onDragEnd={onDragEnd}
      className={'group flex items-center gap-1.5 h-[30px] pr-2 rounded-lg cursor-pointer text-[12px] ' + (on ? 'bg-accentSoft text-[#8E2A18]' : dim ? 'text-muted hover:bg-[#F6F5F2]' : 'text-ink hover:bg-[#F6F5F2]')}
      style={{ paddingLeft: 8 + depth * 14 }} onClick={onClick} onDoubleClick={onDoubleClick}>
      {children}
    </div>
  );
}
const HoverBtn = ({ title, onClick, children, danger }) => (
  <button type="button" title={title} onClick={e => { e.stopPropagation(); onClick(); }} className={'opacity-0 group-hover:opacity-100 px-1 text-[12px] text-muted ' + (danger ? 'hover:text-accent' : 'hover:text-ink')}>{children}</button>
);

function Layers() {
  const { state, act, ui, setUi, canvasApi } = useS();
  const p = state.project, v = state.view, sel = v.selection;
  const [renaming, setRenaming] = useState(null);
  const [expanded, setExpanded] = useState({});
  const [dragId, setDragId] = useState(null);
  const failing = useFailing();
  if (v.tab === 'doc') return <DocRail />;
  const go = (n, selection) => act('set_selection', { selection }).then(() => { if (canvasApi.current.fitNode) canvasApi.current.fitNode(n.id); });
  const delNode = n => {
    const pins = p.pins.filter(x => x.target.nodeId === n.id).length;
    const has = (n.kind === 'page' ? n.blocks.length : 1) + pins;
    if (has && !window.confirm(`Delete ${n.kind === 'page' ? 'page' : 'screen'} "${n.name}"? Its edges${pins ? ` and ${pins} pin(s)` : ''} go with it.`)) return;
    act('delete_node', { nodeId: n.id });
  };
  const reorder = (flow, nodes, fromId, toId) => {
    if (fromId === toId) return;
    const ids = nodes.map(n => n.id).filter(id => id !== fromId);
    ids.splice(ids.indexOf(toId), 0, fromId);
    act('reorder_nodes', { flowId: flow.id, nodeIds: ids });
  };
  const channelBlock = (channel, title, unit) => {
    const flows = p.flows.filter(f => f.channel === channel);
    const count = p.nodes.filter(n => nodeChannel(n) === channel).length;
    return (
      <div className="mb-2">
        <div className="flex items-center justify-between px-2 h-7">
          <span className="ac-label">{title}</span>
          <span className="text-[11px] text-faint">{count} {unit}{count === 1 ? '' : 's'}</span>
          <button type="button" title="Create a flow" className="text-[11px] text-muted hover:text-ink px-1" onClick={async () => { const r = await act('upsert_flow', { channel }); if (r.ok && r.createdId) setRenaming(r.createdId); }}>+ Flow</button>
        </div>
        {flows.map(f => {
          const nodes = laneOrder(f, p.nodes, p.edges);
          const fOn = ui.flowId === f.id;
          return (
            <div key={f.id}>
              <LayerRow depth={0} dim on={fOn} onClick={() => setUi(u => ({ ...u, flowId: f.id }))} onDoubleClick={() => setRenaming(f.id)}>
                {renaming === f.id
                  ? <InlineRename value={f.name} onDone={name => { setRenaming(null); act('upsert_flow', { id: f.id, name }); }} onCancel={() => setRenaming(null)} />
                  : <span className="flex-1 truncate font-medium text-ink" title="Double-click to rename">{f.name}</span>}
                <span className="text-[11px] text-faint">{nodes.length}</span>
                <HoverBtn title={`Add a ${unit}`} onClick={() => act('upsert_node', { flowId: f.id })}>+</HoverBtn>
                {flows.length > 1 && <HoverBtn danger title="Delete flow" onClick={() => { if (window.confirm(`Delete flow "${f.name}" and its ${nodes.length} ${unit}(s)?`)) act('delete_flow', { flowId: f.id }); }}>×</HoverBtn>}
              </LayerRow>
              {nodes.map(n => {
                const isSel = sel && sel.kind === 'node' && sel.nodeId === n.id;
                const open = expanded[n.id] ?? (v.entered === n.id);
                const kids = n.kind === 'page' ? n.blocks : n.hotspots;
                return (
                  <div key={n.id}>
                    <LayerRow depth={1} on={isSel} dataAttr={{ 'data-layer-node': n.id }}
                      draggable onDragStart={() => setDragId(n.id)} onDragEnd={() => setDragId(null)} onDragOver={e => e.preventDefault()}
                      onDrop={e => { e.preventDefault(); if (dragId && p.nodes.find(x => x.id === dragId).flowId === f.id) reorder(f, nodes, dragId, n.id); setDragId(null); }}
                      onClick={() => go(n, { kind: 'node', nodeId: n.id })} onDoubleClick={e => { e.stopPropagation(); act('set_entered', { nodeId: n.id }); if (canvasApi.current.fitNode) canvasApi.current.fitNode(n.id); }}>
                      <button type="button" className="w-3 text-[10px] text-faint" onClick={e => { e.stopPropagation(); setExpanded(x => ({ ...x, [n.id]: !open })); }}>{kids.length ? (open ? '▾' : '▸') : ''}</button>
                      <span className={'inline-block flex-none border-[1.5px] border-current rounded-[3px] opacity-60 ' + (n.kind === 'screen' ? 'w-[9px] h-[13px]' : 'w-[13px] h-[11px]')} />
                      <button type="button" title={f.startId === n.id ? 'Start of flow' : 'Set as start'} className={f.startId === n.id ? 'text-accent text-[11px]' : 'opacity-0 group-hover:opacity-100 text-faint hover:text-accent text-[11px]'}
                        onClick={e => { e.stopPropagation(); if (f.startId !== n.id) act('upsert_flow', { id: f.id, startId: n.id }); }}>{f.startId === n.id ? '★' : '☆'}</button>
                      {renaming === n.id
                        ? <InlineRename value={n.name} onDone={name => { setRenaming(null); act('upsert_node', { id: n.id, name }); }} onCancel={() => setRenaming(null)} />
                        : <span className="flex-1 truncate">{n.name}</span>}
                      {failing.nodes.has(n.id) && <Warn title={failing.nodes.get(n.id)} />}
                      <HoverBtn title="Rename" onClick={() => setRenaming(n.id)}>✎</HoverBtn>
                      <HoverBtn danger title={`Delete ${unit}`} onClick={() => delNode(n)}>×</HoverBtn>
                    </LayerRow>
                    {open && n.kind === 'page' && n.blocks.map(b => {
                      const bSel = sel && sel.kind === 'block' && sel.blockId === b.id && !sel.childId;
                      const children = b.type === 'features' ? b.items.map(i => ({ id: i.id, label: i.title })) : (b.links || []).map(l => ({ id: l.id, label: l.label, toId: l.toId }));
                      return (
                        <div key={b.id}>
                          <LayerRow depth={2} on={bSel} onClick={() => go(n, { kind: 'block', nodeId: n.id, blockId: b.id })}>
                            <span className="flex-1 truncate">{BLOCK_LABEL[b.type]}</span>
                            {failing.blocks.has(b.id) && <Warn title={failing.blocks.get(b.id)} />}
                          </LayerRow>
                          {children.map(c => {
                            const cSel = sel && sel.kind === 'block' && sel.blockId === b.id && sel.childId === c.id;
                            return (
                              <LayerRow key={c.id} depth={3} on={cSel} onClick={() => go(n, { kind: 'block', nodeId: n.id, blockId: b.id, childId: c.id })}>
                                <span className="flex-1 truncate">{c.label || <i className="opacity-60">empty</i>}</span>
                                {c.toId && <span className="text-[10px] text-faint">↗ {(findNode(p, c.toId) || {}).name || ''}</span>}
                              </LayerRow>
                            );
                          })}
                        </div>
                      );
                    })}
                    {open && n.kind === 'screen' && n.hotspots.map(h => {
                      const hSel = sel && sel.kind === 'hotspot' && sel.hotspotId === h.id;
                      return (
                        <LayerRow key={h.id} depth={2} on={hSel} onClick={() => go(n, { kind: 'hotspot', nodeId: n.id, hotspotId: h.id })}>
                          <span className="flex-1 truncate">▭ {h.label}</span>
                          {h.toId && <span className="text-[10px] text-faint">↗ {(findNode(p, h.toId) || {}).name || ''}</span>}
                        </LayerRow>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    );
  };
  const shapes = p.draw.shapes;
  const shapeLabel = s => s.type === 'text' ? `Text “${s.text}”` : s.type[0].toUpperCase() + s.type.slice(1);
  return (
    <div className="px-2 py-2 pb-4">
      {channelBlock('web', 'Web', 'page')}
      {channelBlock('mobile', 'Mobile', 'screen')}
      <div className="flex items-center justify-between px-2 h-7"><span className="ac-label">Diagram</span><span className="text-[11px] text-faint">{shapes.length} shape{shapes.length === 1 ? '' : 's'}</span></div>
      {shapes.map(s => {
        const on = sel && sel.kind === 'shape' && sel.shapeId === s.id;
        return (
          <LayerRow key={s.id} depth={1} on={on} onClick={() => act('set_selection', { selection: { kind: 'shape', shapeId: s.id } }).then(() => canvasApi.current.fitDiagram && canvasApi.current.fitDiagram())}>
            <span className="w-2.5 h-2.5 rounded-sm border" style={{ borderColor: p.tokens.colors[s.stroke || s.ink] }} />
            <span className="truncate">{shapeLabel(s)}</span>
          </LayerRow>
        );
      })}
      {!shapes.length && <div className="px-2 text-[11px] text-faint">Pick a shape tool on the rail and drag on the canvas.</div>}
    </div>
  );
}

function Activity() {
  const { state, act, activity, canvasApi } = useS();
  const p = state.project;
  const [, tick] = useState(0);
  useEffect(() => { const t = setInterval(() => tick(x => x + 1), 30000); return () => clearInterval(t); }, []);
  const jump = e => {
    const m = /[“"]([^”"]+)[”"]/.exec(e.summary);
    const n = m && p.nodes.find(x => x.name === m[1]);
    if (n) act('set_selection', { selection: { kind: 'node', nodeId: n.id } }).then(() => canvasApi.current.fitNode && canvasApi.current.fitNode(n.id));
  };
  return (
    <div className="p-1">
      {activity.map((e, i) => (
        <button key={e.rev + ':' + i} type="button" onClick={() => jump(e)} className="w-full text-left grid gap-2 p-2 rounded-[10px] hover:bg-[#F6F5F2]" style={{ gridTemplateColumns: '22px 1fr' }}>
          <span className={'w-[22px] h-[22px] rounded-full grid place-items-center text-[9px] font-semibold ' + (e.source === 'mcp' ? 'bg-ink text-white' : 'bg-hair text-ink')}>{e.source === 'mcp' ? 'AG' : 'You'}</span>
          <span className="min-w-0">
            <span className="block text-[12px] leading-4 text-ink"><b className="font-medium">{e.source === 'mcp' ? 'Agent' : 'You'}</b> · {e.summary}</span>
            <span className="block text-[11px] text-faint mt-0.5">{ago(e.at)}</span>
          </span>
        </button>
      ))}
      {!activity.length && <div className="px-3 py-6 text-[12px] text-muted leading-5">Nothing yet. Every change by you or a connected agent shows up here.</div>}
    </div>
  );
}

function PromptComposer() {
  const { state, showToast } = useS();
  const [text, setText] = useState('');
  const build = () => {
    const v = state.view, p = state.project;
    const s = v.selection;
    let selLabel = 'none';
    if (s) {
      if (s.nodeId) { const n = findNode(p, s.nodeId); selLabel = n ? `${n.kind} "${n.name}" (${n.id})` + (s.blockId ? `, block ${s.blockId}` : '') + (s.hotspotId ? `, hotspot ${s.hotspotId}` : '') : s.kind; }
      else if (s.edgeId) selLabel = `edge ${s.edgeId}`;
      else if (s.shapeId) selLabel = `shape ${s.shapeId}`;
      else if (s.pinId) selLabel = `pin ${s.pinId}`;
    }
    return `Project "${state.name}" in AgentCanvas (MCP: ${location.origin}/mcp). Selected: ${selLabel}. Open issues: ${state.openIssues}. Request: ${text.trim()}`;
  };
  const copy = async () => {
    if (!text.trim()) return;
    try { await navigator.clipboard.writeText(build()); showToast('Copied. Paste it into Claude Code or Codex.'); }
    catch (e) { showToast('Could not copy. Select the text and copy it yourself.'); }
  };
  return (
    <div className="flex-none border-t border-hair p-2.5">
      <div className="rounded-[10px] border border-hair bg-[#FBFAF8] px-2.5 py-2 focus-within:border-ink">
        <textarea data-prompt="1" value={text} rows={2} placeholder="Ask your agent to change the canvas…" onChange={e => setText(e.target.value)}
          onKeyDown={e => { e.stopPropagation(); if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); copy(); } if (e.key === 'Escape') e.currentTarget.blur(); }}
          className="w-full resize-none bg-transparent text-[12px] leading-4 outline-none placeholder:text-faint" />
        <div className="flex items-center justify-between mt-1">
          <span className="text-[10px] text-faint">{MOD}K · Enter copies</span>
          <button type="button" onClick={copy} disabled={!text.trim()} className="h-6 px-2.5 rounded-md bg-ink text-white text-[11px] font-medium disabled:opacity-40">Copy prompt</button>
        </div>
      </div>
      <div className="text-[10px] text-faint mt-1.5 leading-[14px]">Copies a prompt with project context for Claude Code or Codex. Nothing is sent anywhere.</div>
    </div>
  );
}

function InlineRename({ value, onDone, onCancel }) {
  const [d, setD] = useState(value);
  const ref = useRef(null);
  useEffect(() => { if (ref.current) { ref.current.focus(); ref.current.select(); } }, []);
  return (
    <input ref={ref} value={d} onChange={e => setD(e.target.value)} onClick={e => e.stopPropagation()}
      onBlur={() => (d.trim() && d !== value ? onDone(d.trim()) : onCancel())}
      onKeyDown={e => { e.stopPropagation(); if (e.key === 'Enter') e.currentTarget.blur(); if (e.key === 'Escape') { setD(value); onCancel(); } }}
      className="flex-1 min-w-0 rounded border border-[#D8432A] bg-white px-1 h-6 text-[12px] outline-none" />
  );
}

function useFailing() {
  const { state } = useS();
  return useMemo(() => {
    const blocks = new Map(), nodes = new Map();
    state.checks.contrast.filter(c => !c.pass).forEach(c => {
      if (c.blockId) blocks.set(c.blockId, (blocks.get(c.blockId) ? blocks.get(c.blockId) + '; ' : '') + `${c.label}: ${c.ratio}:1`);
      nodes.set(c.nodeId, (nodes.get(c.nodeId) ? nodes.get(c.nodeId) + '; ' : '') + `${c.label}: ${c.ratio}:1`);
    });
    state.checks.tap.filter(c => !c.pass).forEach(c => nodes.set(c.nodeId, (nodes.get(c.nodeId) ? nodes.get(c.nodeId) + '; ' : '') + c.label));
    return { blocks, nodes };
  }, [state.checks]);
}

function DocRail() {
  const { state, docRef } = useS();
  const heads = mdHeadings(state.project.doc.markdown);
  const jump = h => {
    const el = document.getElementById('md-line-' + h.line);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const ta = docRef.current.textarea;
    if (ta) {
      const lines = ta.value.split('\n');
      let off = 0;
      for (let i = 0; i < h.line && i < lines.length; i++) off += lines[i].length + 1;
      ta.focus();
      ta.setSelectionRange(off, off);
      ta.scrollTop = Math.max(0, h.line * 20 - 40);
    }
  };
  return (
    <div className="flex-1 min-h-0 flex flex-col">
      <div className="px-3 h-8 flex items-center text-[10px] uppercase tracking-[.1em] text-[#6B665C] font-semibold">Headings</div>
      <div className="flex-1 overflow-auto ac-scroll pb-4">
        {heads.map(h => (
          <button key={h.line} type="button" onClick={() => jump(h)} className="w-full text-left h-7 hover:bg-[#EFE8DB] text-[12px] truncate"
            style={{ paddingLeft: 12 + (h.level - 1) * 12, fontWeight: h.level === 1 ? 600 : 400 }}>{h.text}</button>
        ))}
      </div>
    </div>
  );
}

// ---- Inspector ----
// ---- Inspector (§8.1): floating, contextual; panels follow the selection, never the tab ----
// inspectorTarget: what the inspector shows. kind ∈ page | screen | block | hotspot | shape | edge | flow | doc | tokens | null
function inspectorTarget(state, ui) {
  const p = state.project, v = state.view, sel = v.selection;
  if (v.tab === 'doc') return { kind: 'doc' };
  if (sel) {
    if (sel.kind === 'edge') { const e = p.edges.find(x => x.id === sel.edgeId); if (e) return { kind: 'edge', edge: e }; }
    if (sel.kind === 'shape') { const s = p.draw.shapes.find(x => x.id === sel.shapeId); if (s) return { kind: 'shape', shape: s }; }
    if (sel.kind === 'pin') return null; // the pin popover is the editor
    const n = sel.nodeId ? findNode(p, sel.nodeId) : null;
    if (n) {
      if (sel.kind === 'block') { const b = n.blocks.find(x => x.id === sel.blockId); if (b) return { kind: 'block', node: n, block: b, childId: sel.childId || null }; }
      if (sel.kind === 'hotspot') return { kind: 'hotspot', node: n, hotspotId: sel.hotspotId };
      return { kind: n.kind, node: n };
    }
  }
  if (v.entered) { const n = findNode(p, v.entered); if (n) return { kind: n.kind, node: n }; }
  if (ui.flowId) { const f = findFlow(p, ui.flowId); if (f) return { kind: 'flow', flow: f }; }
  if (ui.tokensOpen) return { kind: 'tokens' };
  return null;
}

function Inspector() {
  const { state, ui, setUi } = useS();
  const t = inspectorTarget(state, ui);
  if (!t || ui.inspectorOpen === false) return null;
  const simple = t.kind === 'edge' || t.kind === 'flow' || t.kind === 'doc' || t.kind === 'tokens';
  const tabs = [['content', 'Content'], ['design', 'Design']];
  const tab = simple ? 'content' : ui.inspectorTab === 'design' ? 'design' : 'content';
  const right = state.view.tab === 'doc' ? 14 : 72;
  let body;
  if (t.kind === 'doc') body = <DocContent />;
  else if (t.kind === 'tokens') body = <ProjectTokens />;
  else if (t.kind === 'edge') body = <EdgePanel edge={t.edge} />;
  else if (t.kind === 'flow') body = <FlowContent flow={t.flow} />;
  else if (tab === 'design') body = <DesignPanel t={t} />;
  else body = <ContentPanel t={t} />;
  return (
    <aside key={t.kind} className="ac-float ac-slide-in font-ui" style={{ position: 'absolute', right, top: 14, width: 292, maxHeight: 'calc(100% - 140px)', display: 'flex', flexDirection: 'column', overflow: 'hidden', zIndex: 31 }}>
      {!simple && (
        <div className="flex items-end gap-0.5 px-2 pt-1.5 border-b border-hair flex-none">
          {tabs.map(([k, l]) => (
            <button key={k} type="button" onClick={() => setUi(u => ({ ...u, inspectorTab: k }))}
              className={'relative px-2.5 h-8 text-[12px] font-medium ' + (tab === k ? 'text-ink' : 'text-muted hover:text-ink')}>
              {l}{tab === k && <span className="absolute left-2 right-2 -bottom-px h-0.5 bg-ink rounded" />}
            </button>
          ))}
          <div className="flex-1" />
          <button type="button" className="ac-ibtn mb-0.5" style={{ width: 26, height: 26 }} title={`Hide the inspector (${MOD}.)`} onClick={() => setUi(u => ({ ...u, inspectorOpen: false }))}>×</button>
        </div>
      )}
      <div className="flex-1 min-h-0 overflow-auto ac-scroll">{body}</div>
    </aside>
  );
}

function ContentPanel({ t }) {
  if (t.kind === 'block') return <BlockContent node={t.node} block={t.block} childId={t.childId} />;
  if (t.kind === 'screen' || t.kind === 'hotspot') return <ScreenContent node={t.node} hotspotId={t.kind === 'hotspot' ? t.hotspotId : null} />;
  if (t.kind === 'page') return <NodeContent node={t.node} />;
  if (t.kind === 'shape') return <ShapeContent shape={t.shape} />;
  return null;
}

function DesignPanel({ t }) {
  if (t.kind === 'block') return <div><BlockDesign node={t.node} block={t.block} /><ProjectTokens /></div>;
  if (t.kind === 'screen' || t.kind === 'hotspot') return <div><ScreenDesign node={t.node} /><ProjectTokens /></div>;
  if (t.kind === 'page') return <div><Empty text="Select a block on the page to style it. Project tokens below are global." /><ProjectTokens /></div>;
  if (t.kind === 'shape') return <ShapeDesign shape={t.shape} />;
  return null;
}

// Breakpoint (pages) and start-of-flow, shared by page and screen content.
function NodeMeta({ node }) {
  const { state, act } = useS();
  const v = state.view, f = findFlow(state.project, node.flowId);
  const isStart = !!(f && f.startId === node.id);
  return (
    <>
      {node.kind === 'page' && (
        <Field label="Breakpoint">
          <Seg value={v.breakpoint} onChange={b => act('set_breakpoint', { breakpoint: b })} options={[{ value: 'desktop', label: '1280' }, { value: 'tablet', label: '768' }, { value: 'phone', label: '390' }]} />
        </Field>
      )}
      <Field label="Start of flow">
        <Seg value={isStart ? 'yes' : 'no'} onChange={x => { if (x === 'yes' && f && !isStart) act('upsert_flow', { id: f.id, startId: node.id }); }} options={[{ value: 'yes', label: isStart ? '★ Yes' : 'Make start' }, { value: 'no', label: 'No', title: isStart ? 'Pick another node as the start' : undefined }]} />
      </Field>
    </>
  );
}

function FlowContent({ flow }) {
  const { state, act, setUi } = useS();
  const p = state.project;
  const nodes = laneOrder(flow, p.nodes, p.edges);
  const siblings = p.flows.filter(f => f.channel === flow.channel);
  return (
    <div>
      <div className="px-3 pt-3 pb-2 border-b border-hair">
        <div className="text-[11px] text-faint">{flow.channel === 'web' ? 'Web' : 'Mobile'} › Flow</div>
        <div className="font-semibold text-[14px] mt-0.5 flex items-center justify-between gap-2"><span className="truncate">{flow.name}</span><button type="button" className="ac-ibtn" style={{ width: 24, height: 24 }} title="Close" onClick={() => setUi(u => ({ ...u, flowId: null }))}>×</button></div>
      </div>
      <Section title="Flow">
        <Field label="Name"><TextInput value={flow.name} coalesce={`text:${flow.id}.name`} onSend={(val, o) => val.trim() && act('upsert_flow', { id: flow.id, name: val }, o)} /></Field>
        <Field label="Start">
          <select value={flow.startId || ''} onChange={e => e.target.value && act('upsert_flow', { id: flow.id, startId: e.target.value })} className={inputCls}>
            {!flow.startId && <option value="">No start yet</option>}
            {nodes.map(n => <option key={n.id} value={n.id}>{n.name}</option>)}
          </select>
        </Field>
        <div className="text-[11px] text-muted">{nodes.length} {flow.channel === 'web' ? 'page' : 'screen'}{nodes.length === 1 ? '' : 's'} · {flow.channel} flow</div>
      </Section>
      <Section>
        <div className="flex gap-1.5">
          <button type="button" className="flex-1 h-8 rounded-lg bg-ink text-white text-[12px]" onClick={() => act('upsert_node', { flowId: flow.id })}>+ Add a {flow.channel === 'web' ? 'page' : 'screen'}</button>
          <button type="button" disabled={siblings.length <= 1} title={siblings.length <= 1 ? 'A channel keeps at least one flow' : 'Delete the flow and its nodes'} className="h-8 px-3 rounded-lg border border-hair text-[12px] hover:text-accent hover:border-accent"
            onClick={() => { if (window.confirm(`Delete flow "${flow.name}" and its ${nodes.length} node(s)?`)) { setUi(u => ({ ...u, flowId: null })); act('delete_flow', { flowId: flow.id }); } }}>Delete</button>
        </div>
      </Section>
    </div>
  );
}

function Empty({ text }) { return <div className="px-3 py-6 text-[12px] text-[#6B665C] leading-5">{text}</div>; }

// Shown when a channel has no page or screen yet (a blank project's App flow starts empty).
function NodeHeader({ node, children }) {
  const { state } = useS();
  const f = findFlow(state.project, node.flowId);
  return (
    <div className="px-3 pt-3 pb-2 border-b border-[#DDD5C4]">
      <div className="text-[11px] text-[#6B665C]">{f ? f.name : ''} › {node.kind === 'page' ? 'Page' : 'Screen'}{f && f.startId === node.id ? ' · ★ start' : ''}</div>
      <div className="font-semibold text-[14px] mt-0.5 flex items-center justify-between gap-2"><span className="truncate">{node.name}</span>{children}</div>
    </div>
  );
}

function NodeContent({ node }) {
  const { state, act } = useS();
  const p = state.project;
  const out = p.edges.filter(e => e.fromId === node.id), inn = p.edges.filter(e => e.toId === node.id);
  return (
    <div>
      <NodeHeader node={node} />
      <Section title="Page">
        <Field label="Name"><TextInput value={node.name} coalesce={`text:${node.id}.name`} onSend={(val, o) => val.trim() && act('upsert_node', { id: node.id, name: val }, o)} /></Field>
        <NodeMeta node={node} />
        <div className="text-[11px] text-muted">{node.blocks.length} block{node.blocks.length === 1 ? '' : 's'}. Enter the page (double-click) and click a block, or pick one in Layers.</div>
      </Section>
      <EdgeList title="Outbound" edges={out} dir="to" />
      <EdgeList title="Inbound" edges={inn} dir="from" />
    </div>
  );
}

function EdgeList({ title, edges, dir }) {
  const { state, act } = useS();
  if (!edges.length) return null;
  return (
    <Section title={`${title} · ${edges.length}`}>
      {edges.map(e => {
        const other = findNode(state.project, dir === 'to' ? e.toId : e.fromId);
        return (
          <button key={e.id} type="button" onClick={() => act('set_selection', { selection: { kind: 'edge', edgeId: e.id } })}
            className="w-full flex items-center gap-1.5 text-left text-[12px] py-1 hover:text-[#D8432A]">
            <span className="w-2 h-2 rounded-full flex-none" style={{ background: e.kind === 'cross' ? V : '#232220' }} />
            <span className="truncate flex-1">“{e.label}” {dir === 'to' ? '→' : '←'} {other ? other.name : '?'}</span>
            <span className="text-[10px] text-[#6B665C]">{e.kind}</span>
          </button>
        );
      })}
    </Section>
  );
}

function BlockActions({ node, block }) {
  const { act } = useS();
  const i = node.blocks.findIndex(b => b.id === block.id);
  const move = d => {
    const ids = node.blocks.map(b => b.id);
    const j = i + d;
    if (j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    act('reorder_blocks', { nodeId: node.id, blockIds: ids });
  };
  return (
    <div className="flex items-center gap-0.5">
      <IconButton title="Move up" disabled={i <= 0} onClick={() => move(-1)}>↑</IconButton>
      <IconButton title="Move down" disabled={i >= node.blocks.length - 1} onClick={() => move(1)}>↓</IconButton>
      <IconButton title={`Duplicate (${MOD}D)`} onClick={() => act('duplicate_block', { nodeId: node.id, blockId: block.id })}>Duplicate</IconButton>
      <IconButton title="Delete (Del)" onClick={() => act('delete_block', { nodeId: node.id, blockId: block.id })}>Delete</IconButton>
    </div>
  );
}

function LinkRow({ node, block, link, removable, labelField }) {
  const { act } = useS();
  const owner = labelField ? { blockId: block.id, field: labelField } : { blockId: block.id, childId: link.id };
  const sendLabel = (val, o) => act('update_block', labelField
    ? { nodeId: node.id, blockId: block.id, patch: { [labelField]: { label: val } } }
    : { nodeId: node.id, blockId: block.id, childId: link.id, patch: { label: val } }, o);
  return (
    <div className="mb-2 p-2 rounded border border-[#DDD5C4] bg-white/60">
      <div className="flex gap-1.5 items-center mb-1.5">
        <TextInput value={link.label} coalesce={`text:${link.id}.label`} onSend={sendLabel} />
        {removable && <button type="button" title="Remove" className="px-1.5 text-[14px] hover:text-[#D8432A]" onClick={() => removable()}>×</button>}
      </div>
      <div className="flex items-center gap-1.5"><span className="text-[11px] text-[#6B665C] w-10">Target</span>
        <TargetSelect channel="web" value={link.toId} onChange={to => act('set_link_target', { nodeId: node.id, owner, toId: to })} />
      </div>
    </div>
  );
}

function BlockContent({ node, block, childId }) {
  const { act } = useS();
  const b = block;
  const set = field => (val, o) => act('update_block', { nodeId: node.id, blockId: b.id, patch: { [field]: val } }, o);
  const tf = (label, field, multiline) => (
    <Field label={label}><TextInput value={b[field]} multiline={multiline} rows={multiline ? 3 : undefined} coalesce={`text:${b.id}.${field}`} onSend={set(field)} /></Field>
  );
  const addChild = () => act('upsert_child', { nodeId: node.id, blockId: b.id });
  const delChild = id => act('delete_child', { nodeId: node.id, blockId: b.id, childId: id });
  let child = null;
  if (childId) {
    const link = (b.links || []).find(l => l.id === childId) || [b.cta, b.secondary, b.button].find(l => l && l.id === childId);
    const item = (b.items || []).find(i => i.id === childId);
    if (link) {
      const field = b.cta && b.cta.id === childId ? 'cta' : b.secondary && b.secondary.id === childId ? 'secondary' : b.button && b.button.id === childId ? 'button' : null;
      child = <Section title="Selected link"><LinkRow node={node} block={b} link={link} labelField={field} /></Section>;
    } else if (item) {
      child = (
        <Section title="Selected card">
          <Field label="Title"><TextInput value={item.title} coalesce={`text:${item.id}.title`} onSend={(val, o) => act('update_block', { nodeId: node.id, blockId: b.id, childId: item.id, patch: { title: val } }, o)} /></Field>
          <Field label="Body"><TextInput multiline rows={2} value={item.body} coalesce={`text:${item.id}.body`} onSend={(val, o) => act('update_block', { nodeId: node.id, blockId: b.id, childId: item.id, patch: { body: val } }, o)} /></Field>
        </Section>
      );
    }
  }
  let fields = null;
  if (b.type === 'nav' || b.type === 'footer') {
    fields = (
      <>
        {tf('Brand', 'brand')}
        {b.type === 'footer' && tf('Note', 'note')}
        <div className="text-[11px] text-[#6B665C] mb-1">Links</div>
        {b.links.map(l => <LinkRow key={l.id} node={node} block={b} link={l} removable={() => delChild(l.id)} />)}
        <button type="button" className="text-[12px] hover:text-[#D8432A]" onClick={addChild}>+ add link</button>
      </>
    );
  } else if (b.type === 'hero') {
    fields = (
      <>
        {tf('Eyebrow', 'eyebrow')}{tf('Headline', 'headline')}{tf('Body', 'body', true)}
        <div className="text-[11px] text-[#6B665C] mb-1">Button</div>
        <LinkRow node={node} block={b} link={b.cta} labelField="cta" />
        <div className="text-[11px] text-[#6B665C] mb-1 flex items-center justify-between">Secondary link
          {b.secondary
            ? <button type="button" className="hover:text-[#D8432A]" onClick={() => act('update_block', { nodeId: node.id, blockId: b.id, patch: { secondary: null } })}>remove</button>
            : <button type="button" className="hover:text-[#D8432A]" onClick={() => act('update_block', { nodeId: node.id, blockId: b.id, patch: { secondary: { label: 'Learn more' } } })}>+ add</button>}
        </div>
        {b.secondary && <LinkRow node={node} block={b} link={b.secondary} labelField="secondary" />}
      </>
    );
  } else if (b.type === 'features') {
    fields = (
      <>
        {tf('Heading', 'heading')}
        <div className="text-[11px] text-[#6B665C] mb-1">Cards</div>
        {b.items.map(it => (
          <div key={it.id} className="mb-2 p-2 rounded border border-[#DDD5C4] bg-white/60">
            <div className="flex gap-1.5 mb-1.5">
              <TextInput value={it.title} coalesce={`text:${it.id}.title`} onSend={(val, o) => act('update_block', { nodeId: node.id, blockId: b.id, childId: it.id, patch: { title: val } }, o)} />
              <button type="button" title="Remove" className="px-1.5 text-[14px] hover:text-[#D8432A]" onClick={() => delChild(it.id)}>×</button>
            </div>
            <TextInput multiline rows={2} value={it.body} coalesce={`text:${it.id}.body`} onSend={(val, o) => act('update_block', { nodeId: node.id, blockId: b.id, childId: it.id, patch: { body: val } }, o)} />
          </div>
        ))}
        <button type="button" className="text-[12px] hover:text-[#D8432A]" onClick={addChild}>+ add card</button>
      </>
    );
  } else if (b.type === 'quote') {
    fields = <>{tf('Quote', 'text', true)}{tf('Cite', 'cite')}</>;
  } else if (b.type === 'cta') {
    fields = (
      <>
        {tf('Headline', 'headline')}{tf('Body', 'body', true)}
        <div className="text-[11px] text-[#6B665C] mb-1">Button</div>
        <LinkRow node={node} block={b} link={b.button} labelField="button" />
      </>
    );
  }
  return (
    <div>
      <NodeHeader node={node} />
      <div className="px-3 py-2 border-b border-[#DDD5C4] flex items-center justify-between">
        <span className="font-semibold text-[12px]">{BLOCK_LABEL[b.type]}</span>
        <BlockActions node={node} block={b} />
      </div>
      {child}
      <Section title="Content">{fields}</Section>
    </div>
  );
}

function ScreenContent({ node, hotspotId }) {
  const { act } = useS();
  const n = node;
  const set = field => (val, o) => act('update_screen', { nodeId: n.id, patch: { [field]: val } }, o);
  const hs = hotspotId ? n.hotspots.find(h => h.id === hotspotId) : null;
  const geo = (h, k) => <label className="flex items-center gap-1 text-[11px] text-[#6B665C]">{k}<NumberInput value={h[k]} width={52} min={0} max={k === 'y' || k === 'h' ? 844 : 390} onCommit={val => act('upsert_hotspot', { nodeId: n.id, hotspotId: h.id, [k]: val })} /></label>;
  const hotspotRow = h => (
    <div key={h.id} className={'mb-2 p-2 rounded border bg-white/60 ' + (h.id === hotspotId ? 'border-[#D8432A]' : 'border-[#DDD5C4]')}>
      <div className="flex gap-1.5 mb-1.5">
        <TextInput value={h.label} coalesce={`text:${h.id}.label`} onSend={(val, o) => act('upsert_hotspot', { nodeId: n.id, hotspotId: h.id, label: val }, o)} />
        <button type="button" title="Delete hotspot" className="px-1.5 text-[14px] hover:text-[#D8432A]" onClick={() => act('delete_hotspot', { nodeId: n.id, hotspotId: h.id })}>×</button>
      </div>
      <div className="flex items-center gap-1.5 mb-1.5"><span className="text-[11px] text-[#6B665C] w-10">Target</span>
        <TargetSelect channel="mobile" value={h.toId} onChange={to => act('set_link_target', { nodeId: n.id, owner: { hotspotId: h.id }, toId: to })} /></div>
      <div className="grid grid-cols-2 gap-1">{geo(h, 'x')}{geo(h, 'y')}{geo(h, 'w')}{geo(h, 'h')}</div>
    </div>
  );
  return (
    <div>
      <NodeHeader node={n} />
      {hs && <Section title="Selected hotspot">{hotspotRow(hs)}</Section>}
      <Section title="Screen">
        <Field label="Name"><TextInput value={n.name} coalesce={`text:${n.id}.name`} onSend={(val, o) => val.trim() && act('update_screen', { nodeId: n.id, patch: { name: val } }, o)} /></Field>
        <NodeMeta node={node} />
        <Field label="Title"><TextInput value={n.title} coalesce={`text:${n.id}.title`} onSend={set('title')} /></Field>
        <Field label="Body"><TextInput multiline rows={3} value={n.body} coalesce={`text:${n.id}.body`} onSend={set('body')} /></Field>
      </Section>
      <Section title="CTA" right={n.cta
        ? <button type="button" className="text-[11px] hover:text-[#D8432A]" onClick={() => act('update_screen', { nodeId: n.id, patch: { cta: null } })}>remove</button>
        : <button type="button" className="text-[11px] hover:text-[#D8432A]" onClick={() => act('update_screen', { nodeId: n.id, patch: { cta: { label: 'Continue' } } })}>+ add</button>}>
        {n.cta ? (
          <>
            <Field label="Label"><TextInput value={n.cta.label} coalesce={`text:${n.id}.cta`} onSend={(val, o) => act('update_screen', { nodeId: n.id, patch: { cta: { label: val } } }, o)} /></Field>
            <Field label="Target"><TargetSelect channel="mobile" value={n.cta.toId} onChange={to => act('set_link_target', { nodeId: n.id, owner: { cta: true }, toId: to })} /></Field>
            <Field label="Size"><Seg value={n.cta.size} onChange={s => act('update_screen', { nodeId: n.id, patch: { cta: { size: s } } })} options={[{ value: 'sm', label: 'sm 36' }, { value: 'md', label: 'md 44' }, { value: 'lg', label: 'lg 52' }]} /></Field>
          </>
        ) : <div className="text-[11px] text-[#6B665C]">No CTA on this screen.</div>}
      </Section>
      <Section title={`Hotspots · ${n.hotspots.length}`} right={<button type="button" className="text-[11px] hover:text-[#D8432A]" onClick={() => act('upsert_hotspot', { nodeId: n.id })}>+ Hotspot</button>}>
        {n.hotspots.filter(h => h.id !== hotspotId).map(hotspotRow)}
        {!n.hotspots.length && <div className="text-[11px] text-[#6B665C]">Hotspots are tappable rectangles that link to another screen.</div>}
      </Section>
    </div>
  );
}

function ShapeContent({ shape }) {
  const { act } = useS();
  const s = shape;
  const num = k => <label className="flex items-center gap-1 text-[11px] text-[#6B665C]">{k}<NumberInput value={Math.round(s[k] * 100) / 100} width={60} onCommit={val => act('update_shape', { shapeId: s.id, patch: { [k]: val } })} /></label>;
  const keys = s.type === 'rect' || s.type === 'ellipse' ? ['x', 'y', 'w', 'h'] : s.type === 'line' || s.type === 'arrow' ? ['x1', 'y1', 'x2', 'y2'] : s.type === 'text' ? ['x', 'y'] : [];
  return (
    <div>
      <div className="px-3 py-2 border-b border-[#DDD5C4] flex items-center justify-between">
        <span className="font-semibold text-[12px] capitalize">{s.type}</span>
        <div className="flex gap-0.5">
          <IconButton title={`Duplicate (${MOD}D)`} onClick={() => act('duplicate_shape', { shapeId: s.id })}>Duplicate</IconButton>
          <IconButton title="Delete (Del)" onClick={() => act('delete_shape', { shapeId: s.id })}>Delete</IconButton>
        </div>
      </div>
      {s.type === 'text' && <Section title="Text"><TextInput value={s.text} coalesce={`text:${s.id}.text`} onSend={(val, o) => act('update_shape', { shapeId: s.id, patch: { text: val } }, o)} /></Section>}
      {keys.length > 0 && <Section title="Geometry"><div className="grid grid-cols-2 gap-1">{keys.map(num)}</div></Section>}
      {s.type === 'pen' && <Section title="Stroke"><div className="text-[11px] text-[#6B665C]">{s.points.length} points</div></Section>}
    </div>
  );
}

function DocContent() {
  const { state, showToast } = useS();
  const md = state.project.doc.markdown;
  return (
    <div>
      <Section title="DESIGN.md">
        <div className="text-[12px] mb-3">{wordCount(md)} words · {mdHeadings(md).length} headings</div>
        <div className="flex flex-col gap-1.5">
          <button type="button" className="h-7 rounded border border-[#DDD5C4] bg-white hover:border-[#232220] text-[12px]" onClick={() => downloadExport('design-md')}>Export DESIGN.md</button>
          <button type="button" className="h-7 rounded border border-[#DDD5C4] bg-white hover:border-[#232220] text-[12px]" onClick={async () => {
            const r = await fetch('/api/export/design-md/write', { method: 'POST' }); const j = await r.json(); showToast(j.ok ? `Saved ${j.rel || j.path}` : j.error);
          }}>Save DESIGN.md to project</button>
        </div>
        <div className="text-[11px] text-[#6B665C] mt-3 leading-4">The export appends generated Flows and Open issues sections.</div>
      </Section>
    </div>
  );
}

// ---- Design panel ----
function ContrastReadout({ items }) {
  if (!items.length) return null;
  return (
    <Section title="Contrast">
      {items.map((c, i) => (
        <div key={i} className="flex items-center justify-between text-[12px] py-0.5">
          <span>{c.part === 'body' ? 'Body text' : c.part === 'button' ? 'Button' : 'CTA'} <span className="text-[#6B665C]">({c.role})</span></span>
          <span className="flex items-center gap-1.5"><span className="tabular-nums">{c.ratio.toFixed(1)}:1</span>{!c.pass && <Warn title="Below WCAG AA" />}<Pill tone={c.pass ? 'pass' : 'fail'}>{c.pass ? 'Passes AA' : 'Fails AA'}</Pill></span>
        </div>
      ))}
    </Section>
  );
}

function BlockDesign({ node, block }) {
  const { state, act } = useS();
  const b = block;
  const set = (k, val) => act('update_block', { nodeId: node.id, blockId: b.id, patch: { [k]: val } });
  const checks = state.checks.contrast.filter(c => c.blockId === b.id);
  return (
    <div>
      <div className="px-3 py-2 border-b border-[#DDD5C4] font-semibold text-[12px]">{node.name} › {BLOCK_LABEL[b.type]}</div>
      <Section title="Type">
        <Field label="Type role"><Seg small value={b.typeRole} onChange={x => set('typeRole', x)} options={ORDER} /></Field>
        {b.type === 'hero' && <Field label="Body role"><Seg small value={b.bodyRole} onChange={x => set('bodyRole', x)} options={ORDER} /></Field>}
        <Field label="Weight"><Seg value={b.weight} onChange={x => set('weight', x)} options={WEIGHTS} /></Field>
        <Field label="Align"><Seg value={b.align} onChange={x => set('align', x)} options={['left', 'center']} /></Field>
      </Section>
      <Section title="Space">
        <Field label="Padding (px)"><SpaceScale value={b.pad} onChange={x => set('pad', x)} /></Field>
        <Field label="Gap (px)"><SpaceScale value={b.gap} onChange={x => set('gap', x)} /></Field>
      </Section>
      <Section title="Color">
        <Field label="Fill"><TokenSwatches value={b.fill} onChange={x => set('fill', x)} /></Field>
        <Field label="Ink"><TokenSwatches value={b.ink} onChange={x => set('ink', x)} /></Field>
        {b.type === 'cta' && <Field label="Button fill"><TokenSwatches value={b.buttonFill} onChange={x => set('buttonFill', x)} /></Field>}
        {b.type === 'cta' && <Field label="Button ink"><TokenSwatches value={b.buttonInk} onChange={x => set('buttonInk', x)} /></Field>}
      </Section>
      <ContrastReadout items={checks} />
    </div>
  );
}

function ScreenDesign({ node }) {
  const { state, act } = useS();
  const n = node;
  const set = (k, val) => act('update_screen', { nodeId: n.id, patch: { [k]: val } });
  const contrast = state.checks.contrast.filter(c => c.nodeId === n.id);
  const tap = state.checks.tap.filter(c => c.nodeId === n.id);
  return (
    <div>
      <div className="px-3 py-2 border-b border-[#DDD5C4] font-semibold text-[12px]">{n.name}</div>
      <Section title="Layout">
        <Field label="Archetype"><Seg small value={n.archetype} onChange={x => set('archetype', x)} options={ARCHETYPES.map(a => ({ value: a, label: ARCH_LABEL[a] }))} /></Field>
        <Field label="Layout"><Seg value={n.layout} onChange={x => set('layout', x)} options={LAYOUTS} /></Field>
      </Section>
      <Section title="Type">
        <Field label="Type role"><Seg small value={n.typeRole} onChange={x => set('typeRole', x)} options={ORDER} /></Field>
        <Field label="Weight"><Seg value={n.weight} onChange={x => set('weight', x)} options={WEIGHTS} /></Field>
        <Field label="Align"><Seg value={n.align} onChange={x => set('align', x)} options={['left', 'center']} /></Field>
      </Section>
      <Section title="Space">
        <Field label="Padding (px)"><SpaceScale value={n.pad} onChange={x => set('pad', x)} /></Field>
        <Field label="Gap (px)"><SpaceScale value={n.gap} onChange={x => set('gap', x)} /></Field>
      </Section>
      <Section title="Color">
        <Field label="Fill"><TokenSwatches value={n.fill} onChange={x => set('fill', x)} /></Field>
        <Field label="Ink"><TokenSwatches value={n.ink} onChange={x => set('ink', x)} /></Field>
        {n.cta && <Field label="CTA fill"><TokenSwatches value={n.cta.fill} onChange={x => set('cta', { fill: x })} /></Field>}
