// ---- Review panel ----
function pinWhere(p, pin) {
  if (pin.target.type === 'draw') return 'Draw';
  const n = findNode(p, pin.target.nodeId);
  if (!n) return '?';
  if (pin.target.type === 'board') return 'Storyboard › ' + n.name;
  const b = pin.target.blockId && n.blocks ? n.blocks.find(x => x.id === pin.target.blockId) : null;
  return n.name + (b ? ' › ' + BLOCK_LABEL[b.type] : '');
}

function ReviewPanel() {
  const { state, act, ui, setUi, canvasApi } = useS();
  const p = state.project;
  const f = ui.reviewFilter;
  const setF = patch => setUi(u => ({ ...u, reviewFilter: { ...u.reviewFilter, ...patch } }));
  const pins = p.pins.filter(x => (f.kind === 'all' || x.kind === f.kind) && (f.status === 'all' || (f.status === 'open' ? !x.resolved : x.resolved))).sort((a, b) => a.n - b.n);
  const sel = state.view.selection;
  const failC = state.checks.contrast.filter(c => !c.pass), failT = state.checks.tap.filter(c => !c.pass);
  const jumpCheck = c => {
    if (c.blockId) act('set_selection', { selection: { kind: 'block', nodeId: c.nodeId, blockId: c.blockId } });
    else if (c.ref && c.ref !== 'cta') act('set_selection', { selection: { kind: 'hotspot', nodeId: c.nodeId, hotspotId: c.ref } });
    else act('set_selection', { selection: { kind: 'node', nodeId: c.nodeId } });
    if (canvasApi.current.fitNode) canvasApi.current.fitNode(c.nodeId);
    setUi(u => ({ ...u, inspectorTab: 'design' }));
  };
  return (
    <div>
      <Section title="Pins">
        <div className="flex flex-col gap-1.5 mb-2">
          <Seg small value={f.kind} onChange={k => setF({ kind: k })} options={[{ value: 'all', label: 'All' }, ...PIN_KINDS.map(k => ({ value: k, label: PIN_NAME[k] }))]} />
          <Seg small value={f.status} onChange={s => setF({ status: s })} options={[{ value: 'open', label: 'Open' }, { value: 'resolved', label: 'Resolved' }, { value: 'all', label: 'All' }]} />
        </div>
        {pins.map(x => {
          const on = sel && sel.kind === 'pin' && sel.pinId === x.id;
          return (
            <button key={x.id} type="button" data-review-pin={x.id}
              onClick={() => act('set_selection', { selection: { kind: 'pin', pinId: x.id } }).then(() => { if (x.target.nodeId && canvasApi.current.fitNode) canvasApi.current.fitNode(x.target.nodeId); else if (canvasApi.current.fitDiagram) canvasApi.current.fitDiagram(); })}
              className={'w-full text-left flex gap-2 py-1.5 px-1 rounded-lg ' + (on ? 'bg-accentSoft' : 'hover:bg-[#F6F5F2]')}>
              <span className="flex-none w-[22px] h-[22px] rounded-full text-[11px] font-semibold text-center leading-[22px]" style={{ background: x.resolved ? CH.muted : V, color: '#F4EFE6' }}>{x.resolved ? '✓' : x.n}</span>
              <span className="min-w-0 flex-1">
                <span className="block text-[12px] truncate"><b className="mr-1">{PIN_GLYPH[x.kind]}</b>{firstLine(x.body)}</span>
                <span className="block text-[11px] text-[#6B665C]">#{x.n} · {pinWhere(p, x)}</span>
              </span>
            </button>
          );
        })}
        {!pins.length && <div className="text-[11px] text-muted">No pins match. Pick the Pin tool (C) and click the canvas to add one.</div>}
      </Section>
      <Section title={`Checks · ${failC.length + failT.length}`}>
        {failC.map((c, i) => (
          <button key={'c' + i} type="button" onClick={() => jumpCheck(c)} className="w-full text-left text-[12px] py-1 hover:text-[#D8432A] flex gap-1.5">
            <Warn /> <span>{c.label}: contrast {c.ratio.toFixed(1)}:1 (needs {['lg', 'xl', 'display'].includes(c.role) ? '3.0' : '4.5'})</span>
          </button>
        ))}
        {failT.map((c, i) => (
          <button key={'t' + i} type="button" onClick={() => jumpCheck(c)} className="w-full text-left text-[12px] py-1 hover:text-[#D8432A] flex gap-1.5">
            <Warn /> <span>{c.label}</span>
          </button>
        ))}
        {!failC.length && !failT.length && <div className="text-[11px] text-[#6B665C]">All contrast and tap-target checks pass at this breakpoint.</div>}
      </Section>
    </div>
  );
}

// ---- Pins (§10) ----
function pinVisible(pin, state, ui) {
  const sel = state.view.selection;
  if (sel && sel.kind === 'pin' && sel.pinId === pin.id) return true;
  if (!state.view.showPins) return false;
  if (pin.resolved && ui.reviewFilter.status === 'open') return false;
  return true;
}

function SpecLabel({ x, y, text }) {
  return <span style={{ position: 'absolute', left: x, top: y, background: '#FBF8F2', color: V, font: '500 10px/14px Inter, sans-serif', padding: '0 3px', border: `1px solid ${V}`, borderRadius: 2, whiteSpace: 'nowrap' }}>{text}</span>;
}

// items: [{pin, left, top, coords(clientX, clientY) -> {x, y}}] in container px
function PinsLayer({ items, draft, onDraftDone, scale }) {
  const { state } = useS();
  const sel = state.view.selection;
  return (
    <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 40 }}>
      {items.map(it => <PinMarker key={it.pin.id} {...it} scale={scale || 1} selected={!!(sel && sel.kind === 'pin' && sel.pinId === it.pin.id)} />)}
      {draft && <DraftPin draft={draft} onDone={onDraftDone} />}
    </div>

function PinMarker({ pin, left, top, coords, selected, scale = 1 }) {
  const { act } = useS();
  const [drag, setDrag] = useState(null);
  const ref = useRef(null);
  const down = e => {
    if (e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    let moved = false;
    const move = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 3) return;
      moved = true;
      setDrag({ left: left + dx * scale, top: top + dy * scale }); // deltas are screen px; the marker sits in a scaled layer
    };
    const up = ev => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      if (moved) {
        const c = coords(ev.clientX, ev.clientY);
        act('update_pin', { pinId: pin.id, x: c.x, y: c.y }).then(() => setDrag(null));
      } else act('set_selection', { selection: { kind: 'pin', pinId: pin.id } });
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  const pos = drag || { left, top };
  return (
    <>
      <div ref={ref} data-pin-id={pin.id} title={`${PIN_NAME[pin.kind]} #${pin.n}: ${firstLine(pin.body)}`}
        className={'ac-pin' + (pin.resolved ? ' resolved' : '') + (selected ? ' selected' : '')}
        style={{ left: pos.left, top: pos.top, pointerEvents: 'auto', transform: scale !== 1 ? `scale(${scale})` : undefined }} onPointerDown={down} onClick={e => e.stopPropagation()}>
        {pin.resolved ? '✓' : <><span className="ac-pin-n">{pin.n}</span><span className="ac-pin-kind">{PIN_GLYPH[pin.kind]}</span></>}
      </div>
      {selected && !drag && <PinPopover pin={pin} anchorRef={ref} />}
    </>
  );
}

function useAnchor(anchorRef, deps) {
  const [pos, setPos] = useState(null);
  useLayoutEffect(() => {
    const place = () => {
      if (!anchorRef.current) return;
      const r = anchorRef.current.getBoundingClientRect();
      const left = r.right + 270 > window.innerWidth ? r.left - 268 : r.right + 8;
      setPos({ left: Math.max(8, left), top: clamp(r.top - 6, 56, window.innerHeight - 220) });
    };
    place();
    window.addEventListener('scroll', place, true); window.addEventListener('resize', place);
    return () => { window.removeEventListener('scroll', place, true); window.removeEventListener('resize', place); };
  }, deps); // eslint-disable-line
  return pos;
}

function PinPopover({ pin, anchorRef }) {
  const { state, act } = useS();
  const pos = useAnchor(anchorRef, [pin.x, pin.y, pin.id]);
  const [body, setBody] = useState(pin.body);
  useEffect(() => setBody(pin.body), [pin.body]);
  if (!pos) return null;
  return ReactDOM.createPortal(
    <div className="ac-pop fixed z-[90] w-[260px] bg-[#FBF8F2] border border-[#DDD5C4] rounded shadow-xl p-2.5 text-[12px] text-[#232220] font-ui"
      style={pos} onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()}>
      <div className="flex items-center justify-between mb-1.5">
        <span className="flex items-center gap-1.5 font-semibold"><span className="w-5 h-5 rounded-full text-center leading-5 text-[11px]" style={{ background: V, color: '#F4EFE6' }}>{PIN_GLYPH[pin.kind]}</span>{PIN_NAME[pin.kind]} #{pin.n}</span>
        <select value={pin.kind} onChange={e => act('update_pin', { pinId: pin.id, kind: e.target.value })} className="text-[11px] bg-transparent">
          {PIN_KINDS.map(k => <option key={k} value={k}>{PIN_GLYPH[k]} {PIN_NAME[k]}</option>)}
        </select>
      </div>
      <textarea value={body} rows={3} className={inputCls} onChange={e => setBody(e.target.value)}
        onBlur={() => { if (body.trim() && body !== pin.body) act('update_pin', { pinId: pin.id, body }); }}
        onKeyDown={e => {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (body.trim() && body !== pin.body) act('update_pin', { pinId: pin.id, body }); e.currentTarget.blur(); }
          if (e.key === 'Escape') { e.stopPropagation(); setBody(pin.body); e.currentTarget.blur(); }
        }} />
      <div className="text-[11px] text-[#6B665C] mt-1">{pinWhere(state.project, pin)}</div>
      <div className="flex gap-1.5 mt-2">
        <button type="button" className="flex-1 h-7 rounded bg-[#232220] text-[#F4EFE6] text-[12px]" onClick={() => act('update_pin', { pinId: pin.id, resolved: !pin.resolved })}>{pin.resolved ? 'Reopen' : 'Resolve'}</button>
        <button type="button" className="h-7 px-3 rounded border border-[#DDD5C4] text-[12px] hover:text-[#D8432A]" onClick={() => act('delete_pin', { pinId: pin.id })}>Delete</button>
      </div>
    </div>,
    document.body);
}

// A pin being placed: local until Enter saves it with add_pin (§10).
function DraftPin({ draft, onDone }) {
  const { act, ui } = useS();
  const ref = useRef(null);
  const [body, setBody] = useState('');
  const pos = useAnchor(ref, [draft.left, draft.top]);
  const save = async () => {
    if (!body.trim()) { onDone(); return; }
    const res = await act('add_pin', { kind: ui.pinKind, body, target: draft.target, x: draft.x, y: draft.y });
    onDone(res);
  };
  return (
    <>
      <div ref={ref} className="ac-pin" style={{ left: draft.left, top: draft.top, opacity: .85 }}>{PIN_GLYPH[ui.pinKind]}</div>
      {pos && ReactDOM.createPortal(
        <div className="ac-pop fixed z-[90] w-[260px] bg-[#FBF8F2] border border-[#DDD5C4] rounded shadow-xl p-2.5 text-[12px] font-ui text-[#232220]"
          style={pos} onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()}>
          <div className="font-semibold mb-1.5">{PIN_GLYPH[ui.pinKind]} New {PIN_NAME[ui.pinKind].toLowerCase()}</div>
          <textarea autoFocus value={body} rows={3} className={inputCls} placeholder="Type a note — Enter saves, Shift+Enter for a new line"
            onChange={e => setBody(e.target.value)} onBlur={() => { if (!body.trim()) onDone(); }}
            onKeyDown={e => {
              if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
              if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); onDone(); }
            }} />
        </div>, document.body)}
    </>
  );
}

// Measures child rects (by data attribute) relative to a container, in the container's unscaled px.
function useRects(containerRef, attr, sig) {
  const [rects, setRects] = useState({});
  const measure = useCallback(() => {
    const c = containerRef.current;
    if (!c) return;
    const base = c.getBoundingClientRect();
    const out = {};
    c.querySelectorAll(`[${attr}]`).forEach(el => {
      const r = el.getBoundingClientRect();
      out[el.getAttribute(attr)] = { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height };
    });
    setRects(prev => (JSON.stringify(prev) === JSON.stringify(out) ? prev : out));
  }, [containerRef, attr]);
  useLayoutEffect(() => { measure(); }, [measure, sig]);
  useEffect(() => {
    const c = containerRef.current;
    if (!c || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => measure());
    ro.observe(c);
    window.addEventListener('resize', measure);
    document.fonts && document.fonts.ready.then(measure);
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
  }, [measure, containerRef]);
  return [rects, measure];
}

// ---- Specs and grid overlays (§8.3) ----
function SpecsOverlay({ containerRef, childId, padTop, padLeft, gap, sig }) {
  const [labels, setLabels] = useState([]);
  const [secW, setSecW] = useState(0);
  const measure = useCallback(() => {
    const sec = containerRef.current;
    if (!sec) return;
    const base = sec.getBoundingClientRect();
    const k = sec.offsetWidth ? base.width / sec.offsetWidth : 1;
    const els = childId ? [sec.querySelector(`[data-child-id="${childId}"]`)].filter(Boolean) : [...sec.querySelectorAll('[data-main]')];
    setSecW(sec.offsetWidth);
    setLabels(els.map(el => {
      const r = el.getBoundingClientRect();
      const spec = el.getAttribute('data-spec') || (el.querySelector('[data-spec]') || { getAttribute: () => '' }).getAttribute('data-spec');
      return { x: (r.left - base.left) / k, y: (r.top - base.top) / k, w: r.width / k, h: r.height / k, text: spec };
    }));
  }, [containerRef, childId]);
  useLayoutEffect(() => { measure(); }, [measure, sig]);
  useEffect(() => {
    const sec = containerRef.current;
    if (!sec || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => measure()); // the frame animates its width for 150 ms
    ro.observe(sec);
    return () => ro.disconnect();
  }, [measure, containerRef]);
  const first = labels[0];
  const topX = padLeft + 64; // clear of the block label chip
  return (
    <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 25 }}>
      <div style={{ position: 'absolute', left: topX, top: 0, height: padTop, borderLeft: `1px solid ${V}` }} />
      <SpecLabel x={topX + 4} y={Math.max(1, padTop / 2 - 7)} text={String(padTop)} />
      <div style={{ position: 'absolute', left: 0, top: padTop + 14, width: padLeft, borderTop: `1px solid ${V}` }} />
      <SpecLabel x={2} y={padTop + 16} text={String(padLeft)} />
      {labels.map((l, i) => (
        <Fragment key={i}>
          <div style={{ position: 'absolute', left: l.x, top: l.y, width: l.w, height: l.h, outline: `1px dashed ${V}`, opacity: .7 }} />
          <SpecLabel x={l.x + l.w + 64 < secW ? l.x + l.w + 6 : Math.max(0, l.x)} y={l.x + l.w + 64 < secW ? l.y : Math.max(0, l.y - 16)} text={l.text} />
        </Fragment>
      ))}
      {first && !childId && gap > 0 && (
        <>
          <div style={{ position: 'absolute', left: first.x + 10, top: first.y + first.h, height: gap, borderLeft: `1px solid ${V}` }} />
          <SpecLabel x={first.x + 14} y={first.y + first.h + gap / 2 - 7} text={`gap ${gap}`} />
        </>
      )}
    </div>
  );
}

function GridOverlay({ bp }) {

}

function Bezel({ children, flowNodes, currentId, onScreenClick }) {

// ---- Storyboard (§8.2) ----
function cubicAt(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3;
}

function EdgeLabelInput({ onDone }) {
  const [d, setD] = useState('Link');
  const ref = useRef(null);
  const done = useRef(false);
  const finish = val => { if (done.current) return; done.current = true; onDone(val); };
  useEffect(() => { ref.current.focus(); ref.current.select(); }, []);
  return (
    <div className="bg-[#FBF8F2] border border-[#D8432A] rounded shadow-lg p-1.5 flex items-center gap-1.5 font-ui">
      <input ref={ref} value={d} onChange={e => setD(e.target.value)} className="w-40 h-6 px-1.5 rounded border border-[#DDD5C4] text-[12px] outline-none"
        onKeyDown={e => { e.stopPropagation(); if (e.key === 'Enter') finish(d.trim() || 'Link'); if (e.key === 'Escape') finish(null); }}
        onBlur={() => finish(null)} />

// ---- Preview / Play (§8.7) ----
function PreviewStage({ navRef }) {
  const { state, act } = useS();
  const p = state.project, v = state.view;
  const mobile = v.tab === 'story';
  const startId = useMemo(() => {
    if (!mobile) return v.currentNodeId.web;
    const cur = findNode(p, v.currentNodeId.mobile);
    const f = cur && findFlow(p, cur.flowId);
    return (f && f.startId) || v.currentNodeId.mobile;
  }, []); // eslint-disable-line
  const [stack, setStack] = useState([startId]);
  const curId = stack[stack.length - 1];
  const node = findNode(p, curId) || findNode(p, startId);
  const go = useCallback(toId => { if (toId && findNode(p, toId)) setStack(s => [...s, toId]); }, [p]);
  const back = useCallback(() => setStack(s => (s.length > 1 ? s.slice(0, -1) : s)), []);
  const exit = () => act('set_preview', { on: false });
  useEffect(() => {
    navRef.current = {
      back,
      forward: () => { const e = node && p.edges.find(x => x.fromId === node.id && x.kind === 'primary'); if (e) go(e.toId); },
    };
    return () => { navRef.current = null; };
  });
  if (!node) return <div className="fixed inset-0 z-[100] flex items-center justify-center text-[#F4EFE6]" style={{ background: CH.stage }}>Nothing to preview. <button className="underline ml-2" onClick={exit}>Exit</button></div>;
  let stage;
  if (!mobile) {
    const w = BREAKPOINTS[v.breakpoint];
    stage = (
      <div className="absolute inset-0 overflow-auto ac-scroll" key={node.id}>
        <div className="ac-preview ac-fade mx-auto my-8 shadow-2xl" style={{ width: w, background: p.tokens.colors.paper }}>
          {node.blocks.map(b => renderBlock(b, { tokens: p.tokens, bp: v.breakpoint, mode: 'preview', nodeId: node.id, onNavigate: go }))}
        </div>
      </div>
    );
  } else {
    const flow = findFlow(p, node.flowId);
    const fnodes = flow ? laneOrder(flow, p.nodes, p.edges) : [node];
    const tapBack = e => {
      if (e.target.closest('[data-hotspot],[data-cta]')) return;
      const r = e.currentTarget.getBoundingClientRect();
      if (e.clientX - r.left < r.width * 0.25) back();
    };
    stage = (
      <div className="absolute inset-0 overflow-auto ac-scroll flex items-start justify-center py-8">
        <Bezel flowNodes={fnodes} currentId={node.id} onScreenClick={tapBack}>
          <div key={node.id} className="ac-fade ac-preview" style={{ position: 'absolute', inset: 0 }}>
            {renderScreen(node, { tokens: p.tokens, mode: 'preview', onTap: go })}
          </div>
        </Bezel>
      </div>
    );
  }
  return (
    <div className="fixed inset-0 z-[100]" style={{ background: CH.stage }}>
      {stage}
      <div className="fixed left-1/2 -translate-x-1/2 bottom-5 z-[101] flex items-center gap-2 h-9 pl-2 pr-1.5 rounded-full bg-[#F4EFE6] text-[#232220] shadow-xl text-[12px]">
        <button type="button" title="Back" disabled={stack.length < 2} onClick={back} className="w-7 h-7 rounded-full hover:bg-[#E9E2D4]">←</button>
        <span><b>{mobile ? 'Play' : 'Preview'}</b> · {node.name} · Esc to exit</span>
        <button type="button" title="Exit (Esc)" onClick={exit} className="w-7 h-7 rounded-full hover:bg-[#E9E2D4] text-[15px]">×</button>
      </div>
    </div>
  );
}

// ===== Section 7: Editors =====
function useLatest(v) { const r = useRef(v); r.current = v; return r; }

// ---- Canvas (§8.2): viewport, auto layout, shell ----
const ART = { GROUP_PAD: 40, GAP_X: 120, GAP_Y: 160, COL_GAP: 400, DIAGRAM_GAP: 200, DEFAULT_PAGE_H: 800, EMPTY_W: 400, EMPTY_H: 200 };
const ZOOM_MIN = 0.1, ZOOM_MAX = 4, LOD_FLAT = 0.12; // SPEC: flat cards below 12 % so fit-all on a 9-node project still shows real pages

function nodeSize(n, bp, heights) {
  if (n.kind === 'screen') return { w: PHONE_W, h: PHONE_H };
  return { w: BREAKPOINTS[bp] || 1280, h: (heights && heights[n.id]) || ART.DEFAULT_PAGE_H };
}
function bboxOf(boxes) {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  boxes.forEach(b => { x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.w); y2 = Math.max(y2, b.y + b.h); });
  return boxes.length ? { x: x1, y: y1, w: x2 - x1, h: y2 - y1 } : null;
}
// layoutCanvas(project, breakpoint, measuredHeights) → { pos, groups, diagram, bounds }
// Web groups stack from (0,0); mobile groups in a column right of the widest web group; the diagram below the web groups.
// Nodes with pos keep it; the rest fill left-to-right in lane order after the right-most placed node.
function layoutCanvas(p, bp, heights) {
  const pos = {}, groups = [];
  const PAD = ART.GROUP_PAD;
  const place = (flows, x0, y0) => {
    let y = y0, right = x0;
    flows.forEach(f => {
      const nodes = laneOrder(f, p.nodes, p.edges);
      const innerX = x0 + PAD, innerY = y + PAD;
      let cursor = innerX, placedRight = -Infinity;
      nodes.forEach(n => {
        if (n.pos) { const s = nodeSize(n, bp, heights); pos[n.id] = { x: n.pos.x, y: n.pos.y, w: s.w, h: s.h }; placedRight = Math.max(placedRight, n.pos.x + s.w); }
      });
      if (placedRight > -Infinity) cursor = Math.max(cursor, placedRight + ART.GAP_X);
      nodes.forEach(n => {
        if (!n.pos) { const s = nodeSize(n, bp, heights); pos[n.id] = { x: cursor, y: innerY, w: s.w, h: s.h }; cursor += s.w + ART.GAP_X; }
      });
      const bb = bboxOf(nodes.map(n => pos[n.id]));
      const g = bb ? { x: bb.x - PAD, y: bb.y - PAD, w: bb.w + 2 * PAD, h: bb.h + 2 * PAD } : { x: x0, y, w: ART.EMPTY_W, h: ART.EMPTY_H };
      groups.push({ flow: f, nodes, x: g.x, y: g.y, w: g.w, h: g.h });
      y = g.y + g.h + ART.GAP_Y;
      right = Math.max(right, g.x + g.w);
    });
    return { bottom: y - ART.GAP_Y, right };
  };
  const webFlows = p.flows.filter(f => f.channel === 'web'), mobileFlows = p.flows.filter(f => f.channel === 'mobile');
  const web = place(webFlows, 0, 0);
  const mobile = place(mobileFlows, (webFlows.length ? web.right : 0) + ART.COL_GAP, 0);
  const diagram = { x: 0, y: (webFlows.length ? web.bottom : 0) + ART.DIAGRAM_GAP };
  const shapeBoxes = p.draw.shapes.map(s => { const b = shapeBox(s, p.tokens); return { x: b.x + diagram.x, y: b.y + diagram.y, w: b.w, h: b.h }; });
  const diagramBox = bboxOf(shapeBoxes) || { x: diagram.x, y: diagram.y, w: 600, h: 400 };
  const bounds = bboxOf([...groups, diagramBox]) || { x: 0, y: 0, w: 1280, h: 800 };
  return { pos, groups, diagram, diagramBox, bounds };
}

// useViewport(ref, serverView, commit): pan/zoom state for the canvas element at ref.
// Wheel pans; ctrl/meta+wheel (and trackpad pinch) zooms around the cursor. Commits go through a 250 ms debounce.
function useViewport(ref, serverView, commit) {
  const [view, setView] = useState({ x: 0, y: 0, zoom: 1 });
  const [anim, setAnim] = useState(false);
  const vRef = useRef(view), lastSent = useRef(null), timer = useRef(0), animT = useRef(0);
  useEffect(() => {
    if (!serverView || !serverView.zoom) return;
    if (!lastSent.current || JSON.stringify(serverView) !== JSON.stringify(lastSent.current)) { vRef.current = serverView; setView(serverView); lastSent.current = serverView; }
  }, [serverView]);
  const set = useCallback((fn, doCommit) => {
    const n = fn(vRef.current);
    const next = { x: n.x, y: n.y, zoom: clamp(n.zoom, ZOOM_MIN, ZOOM_MAX) };
    vRef.current = next; setView(next);
    if (doCommit) { clearTimeout(timer.current); timer.current = setTimeout(() => { lastSent.current = next; commit(next); }, 250); }
    return next;
  }, [commit]);
  const rect = () => (ref.current ? ref.current.getBoundingClientRect() : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight });
  const toWorld = useCallback((cx, cy) => { const r = rect(), v = vRef.current; return { x: (cx - r.left - v.x) / v.zoom, y: (cy - r.top - v.y) / v.zoom }; }, []); // eslint-disable-line
  const toScreen = useCallback((wx, wy) => { const v = vRef.current; return { x: v.x + wx * v.zoom, y: v.y + wy * v.zoom }; }, []);
  const zoomAt = useCallback((f, mx, my) => set(v => { const z = clamp(v.zoom * f, ZOOM_MIN, ZOOM_MAX); return { x: mx - (mx - v.x) * z / v.zoom, y: my - (my - v.y) * z / v.zoom, zoom: z }; }, true), [set]);
  const zoomBy = useCallback(f => { const r = rect(); return zoomAt(f, r.width / 2, r.height / 2); }, [zoomAt]); // eslint-disable-line
  const panBy = useCallback((dx, dy, doCommit) => set(v => ({ ...v, x: v.x + dx, y: v.y + dy }), doCommit), [set]);
  const animate = useCallback(() => { setAnim(true); clearTimeout(animT.current); animT.current = setTimeout(() => setAnim(false), 240); }, []);
  const fitTo = useCallback((box, pad, doAnimate) => {
    if (!box) return;
    const r = rect();
    const z = clamp(Math.min((r.width - 2 * pad) / Math.max(1, box.w), (r.height - 2 * pad) / Math.max(1, box.h)), ZOOM_MIN, ZOOM_MAX);
    const x = (r.width - box.w * z) / 2 - box.x * z, y = (r.height - box.h * z) / 2 - box.y * z;
    if (doAnimate) animate();
    return set(() => ({ x, y, zoom: z }), true);
  }, [set, animate]); // eslint-disable-line
  const setZoom = useCallback(z => { const r = rect(); return zoomAt(z / vRef.current.zoom, r.width / 2, r.height / 2); }, [zoomAt]); // eslint-disable-line
  // the canvas element attaches this with { passive: false } once it exists
  const onWheel = useCallback(e => {
    e.preventDefault();
    const r = rect();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.006), e.clientX - r.left, e.clientY - r.top);
    else panBy(-e.deltaX, -e.deltaY, true);
  }, [zoomAt, panBy]); // eslint-disable-line
  return { view, anim, set, toWorld, toScreen, zoomAt, zoomBy, setZoom, panBy, fitTo, animate, onWheel, ref: vRef };
}

// ---- Artboards (§8.2): one per node, real renderer, levels of detail, drag to place ----
const Artboard = memo(function Artboard({ node, box, zoom, bp, tokens, selected, entered, dimmed, isStart, onDown, onDbl, onPortDown, children }) {
  const k = 1 / zoom;
  const flat = zoom < LOD_FLAT;
  const screen = node.kind === 'screen';
  const portY = Math.min(box.h, 400) / 2;
  let body;
  if (flat) body = <div data-art-body={screen ? undefined : node.id} style={{ width: box.w, height: box.h, display: 'flex', alignItems: 'center', justifyContent: 'center', color: CH.muted, fontSize: 24 * k, fontFamily: SERIF }}>{node.name}</div>;
  else if (screen) body = <div data-art-body={undefined} style={{ width: PHONE_W, height: PHONE_H, position: 'relative', overflow: 'hidden', borderRadius: 18, background: tokens.colors.paper }}>{renderScreen(node, { tokens, mode: entered ? 'edit' : 'thumb' })}</div>;
  else body = (
    <div data-art-body={node.id} style={{ width: box.w, background: tokens.colors.paper, minHeight: 240 }}>
      {node.blocks.map(b => renderBlock(b, { tokens, bp, mode: entered ? 'edit' : 'thumb', nodeId: node.id }))}
      {!node.blocks.length && <div style={{ height: 240, display: 'flex', alignItems: 'center', justifyContent: 'center', font: `13px Inter, sans-serif`, color: CH.muted }}>Empty page — add blocks, or ask your agent to design it.</div>}
    </div>
  );
  return (
    <div data-art-id={node.id} className={'ac-art' + (dimmed ? ' ac-dim' : '')} onPointerDown={onDown} onDoubleClick={onDbl}
      style={{ left: box.x, top: box.y, width: box.w, height: box.h, borderRadius: screen ? 18 : 0, overflow: screen ? 'hidden' : 'visible', cursor: entered ? 'default' : 'pointer',
        outline: selected ? `${2 * k}px solid ${V}` : undefined, zIndex: entered ? 3 : 2 }}>
      {/* name label: anchored 6 screen px above the artboard, counter-scaled */}
      <div style={{ position: 'absolute', left: 0, top: -6 * k, height: 0, pointerEvents: 'none' }}>
        <div style={{ position: 'absolute', left: 0, bottom: 0, transform: `scale(${k})`, transformOrigin: '0 100%', whiteSpace: 'nowrap', font: '500 12px/16px Inter, sans-serif', color: selected ? V : CH.ink, display: 'flex', gap: 6, alignItems: 'baseline' }}>
          {isStart && <span style={{ color: V, fontSize: 11 }} title="Start of flow">★</span>}
          <span>{node.name}</span>
          {!screen && <span style={{ color: CH.faint, fontSize: 11 }}>{box.w}</span>}
        </div>
      </div>
      <div style={{ pointerEvents: entered ? 'auto' : 'none', overflow: screen ? 'visible' : 'hidden', height: screen ? undefined : box.h }}>{body}</div>
      {children}
      <span data-port="in" title="Input" style={{ position: 'absolute', left: -5 * k, top: portY - 5 * k, width: 10 * k, height: 10 * k, borderRadius: '50%', background: '#fff', border: `${1.5 * k}px solid ${CH.edge}`, zIndex: 4 }} />
      <span data-port="out" title="Drag to connect" onPointerDown={e => onPortDown && onPortDown(e, node, portY)} style={{ position: 'absolute', left: box.w - 5 * k, top: portY - 5 * k, width: 10 * k, height: 10 * k, borderRadius: '50%', background: V, border: `${1.5 * k}px solid #fff`, boxShadow: `0 0 0 ${1 * k}px ${V}`, zIndex: 4, cursor: 'crosshair' }} />
    </div>
  );
});

// Measures the natural height of every page body (ResizeObserver contentRect is in unscaled px).
function useArtboardHeights(worldRef, idsKey) {
  const [heights, setHeights] = useState({});
  useLayoutEffect(() => {
    const world = worldRef.current;
    if (!world || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(entries => {
      setHeights(prev => {
        let next = prev, changed = false;
        entries.forEach(e => {
          const id = e.target.getAttribute('data-art-body');
          const h = Math.max(240, Math.round(e.contentRect.height));
          if (id && prev[id] !== h) { if (!changed) { next = { ...prev }; changed = true; } next[id] = h; }
        });
        return changed ? next : prev;
      });
    });
    world.querySelectorAll('[data-art-body]').forEach(el => ro.observe(el));
    return () => ro.disconnect();
  }, [worldRef, idsKey]);
  return heights;
}

function Artboards({ layout, zoom, bp, tokens, nodes, flows, sel, entered, tool, annotateDown, pinsFor, onPortDown }) {
  const { act, viewport } = useS();
  const [drag, setDrag] = useState(null); // {id, x, y}
  const startByFlow = useMemo(() => Object.fromEntries(flows.map(f => [f.id, f.startId])), [flows]);
  const onDown = (e, n) => {
    if (e.button !== 0 || e.target.closest('[data-port]')) return;
    if (tool === 'pin') { annotateDown(e, n); return; }
    if (tool !== 'select' || entered === n.id) return;
    e.stopPropagation();
    const box = layout.pos[n.id];
    const w0 = viewport.toWorld(e.clientX, e.clientY);
    let moved = false, cur = null;
    const move = ev => {
      const w = viewport.toWorld(ev.clientX, ev.clientY);
      const dx = w.x - w0.x, dy = w.y - w0.y;
      if (!moved && Math.hypot(dx, dy) * viewport.ref.current.zoom < 4) return;
      moved = true;
      cur = { id: n.id, x: snap(box.x + dx, !ev.altKey), y: snap(box.y + dy, !ev.altKey) };
      setDrag(cur);
    };
    const up = () => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      if (moved && cur) act('move_node', { nodeId: n.id, x: Math.round(cur.x), y: Math.round(cur.y) }).then(() => setDrag(null));
      else if (!(sel && sel.kind === 'node' && sel.nodeId === n.id)) act('set_selection', { selection: { kind: 'node', nodeId: n.id } });
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  return nodes.map(n => {
    let box = layout.pos[n.id];
    if (!box) return null;
    if (drag && drag.id === n.id) box = { ...box, x: drag.x, y: drag.y };
    return (
      <Artboard key={n.id} node={n} box={box} zoom={zoom} bp={bp} tokens={tokens} isStart={startByFlow[n.flowId] === n.id}
        selected={!!(sel && sel.nodeId === n.id && (sel.kind === 'node' || sel.kind === 'block' || sel.kind === 'hotspot'))}
        entered={entered === n.id} dimmed={!!entered && entered !== n.id}
        onDown={e => onDown(e, n)} onDbl={e => { e.stopPropagation(); if (entered !== n.id) act('set_entered', { nodeId: n.id }); }} onPortDown={onPortDown}>
        {pinsFor ? pinsFor(n, box) : null}
      </Artboard>
    );
  });
}

// ---- Connectors (§8.2): cubic edges between artboard ports in world space ----
function edgeGeom(a, b, kind, off) {
  const x1 = a.x + a.w, y1 = a.y + Math.min(a.h, 400) / 2 + off;
  const x2 = b.x, y2 = b.y + Math.min(b.h, 400) / 2 + off;
  let c;
  if (kind === 'back' || x2 < x1 + 40) {
    // back and leftward edges bow below the lower artboard so they read as returns
    const chan = Math.max(a.y + a.h, b.y + b.h) + ART.GAP_Y * 0.4 + off;
    const reach = Math.min(320, Math.max(140, Math.abs(x2 - x1) / 3));
    c = [x1 + reach, chan, x2 - reach, chan];
  } else {
    const dx = Math.max(80, (x2 - x1) / 2);
    c = [x1 + dx, y1, x2 - dx, y2];
  }
  const mx = cubicAt(x1, c[0], c[2], x2, 0.5), my = cubicAt(y1, c[1], c[3], y2, 0.5);
  return { d: `M${x1},${y1} C${c[0]},${c[1]} ${c[2]},${c[3]} ${x2},${y2}`, mx, my };
}

function Connectors({ layout, edges, zoom, sel, drag }) {
  const { act } = useS();
  const [hover, setHover] = useState(null);
  const k = 1 / zoom;
  const groups = {};
  edges.forEach(e => { const key = e.fromId + '>' + e.toId; (groups[key] = groups[key] || []).push(e.id); });
  const select = (ev, e) => { ev.stopPropagation(); act('set_selection', { selection: { kind: 'edge', edgeId: e.id } }); };
  const m = 8 * k; // arrowheads keep their screen size
  return (
    <svg style={{ position: 'absolute', left: 0, top: 0, width: 1, height: 1, overflow: 'visible', pointerEvents: 'none', zIndex: 3 }}>
      <defs>
        {[['edge', CH.edge], ['v', V]].map(([id, c]) => (
          <marker key={id} id={'ac-arrow-' + id} viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth={m} markerHeight={m} orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill={c} /></marker>
        ))}
      </defs>
      {edges.map(e => {
        const a = layout.pos[e.fromId], b = layout.pos[e.toId];
        if (!a || !b) return null;
        const g = groups[e.fromId + '>' + e.toId];
        const off = (g.indexOf(e.id) - (g.length - 1) / 2) * 28;
        const geo = edgeGeom(a, b, e.kind, off);
        const cross = e.kind === 'cross';
        const on = sel && sel.kind === 'edge' && sel.edgeId === e.id;
        const hot = hover === e.id;
        const color = cross ? V : CH.edge;
        return (
          <g key={e.id} data-edge-id={e.id} style={{ opacity: hover && !hot && !on ? 0.55 : 1, transition: 'opacity 120ms' }}>
            {on && <path d={geo.d} fill="none" stroke={V} strokeOpacity=".2" strokeWidth="8" vectorEffect="non-scaling-stroke" />}
            <path d={geo.d} fill="none" stroke={color} strokeWidth={(cross ? 2 : 1.5) + (hot ? 0.5 : 0)} vectorEffect="non-scaling-stroke"
              strokeDasharray={e.kind === 'alt' ? '6 4' : e.kind === 'back' ? '2 4' : undefined} markerEnd={`url(#ac-arrow-${cross ? 'v' : 'edge'})`} />
            {/* SPEC: §9.3 edge hit test — a 12px transparent stroke gives the same 6px tolerance natively */}
            <path d={geo.d} fill="none" stroke="transparent" strokeWidth="12" vectorEffect="non-scaling-stroke" style={{ pointerEvents: 'stroke', cursor: 'pointer' }}
              onPointerEnter={() => setHover(e.id)} onPointerLeave={() => setHover(h => (h === e.id ? null : h))} onPointerDown={ev => select(ev, e)} />
            {(zoom >= 0.3 || on || hot) && <g transform={`translate(${geo.mx},${geo.my}) scale(${k})`} style={{ pointerEvents: 'all', cursor: 'pointer' }}
              onPointerEnter={() => setHover(e.id)} onPointerLeave={() => setHover(h => (h === e.id ? null : h))} onPointerDown={ev => select(ev, e)}>
              <rect x={-(e.label.length * 3.2 + 8)} y="-9" width={e.label.length * 6.4 + 16} height="18" rx="9" fill={on ? V : '#fff'} stroke={on ? V : cross ? V : '#E6E3DC'} />
              <text textAnchor="middle" y="3.5" style={{ font: '500 11px Inter, sans-serif' }} fill={on ? '#fff' : cross ? V : CH.ink}>{e.label}</text>
            </g>}
          </g>
        );
      })}
      {drag && <path d={`M${drag.x1},${drag.y1} C${drag.x1 + 160},${drag.y1} ${drag.x2 - 160},${drag.y2} ${drag.x2},${drag.y2}`} fill="none" stroke={V} strokeWidth="2" strokeDasharray="5 4" vectorEffect="non-scaling-stroke" />}
    </svg>
  );
}

// ---- Flow groups (§8.2) ----
function Groups({ layout, zoom, flowId }) {
  const { act, setUi } = useS();
  const [renaming, setRenaming] = useState(null);
  const k = 1 / zoom;
  return layout.groups.map(g => {
    const unit = g.flow.channel === 'web' ? 'page' : 'screen';
    const n = g.nodes.length;
    const on = flowId === g.flow.id;
    const placed = g.nodes.some(x => x.pos);
    return (
      <div key={g.flow.id} data-canvas-bg="1" data-group-id={g.flow.id} className="ac-group" style={{ position: 'absolute', left: g.x, top: g.y, width: g.w, height: g.h, border: `${1 * k}px dashed ${on ? V : '#D2CFC7'}`, borderRadius: 16 * k, background: 'rgba(255,255,255,.28)' }}>
        <div style={{ position: 'absolute', left: 14 * k, top: -9 * k, height: 0 }}>
          <div className="ac-group-head" style={{ position: 'absolute', left: 0, top: 0, transform: `scale(${k})`, transformOrigin: '0 50%', display: 'flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap', background: CH.backdrop, padding: '2px 8px', borderRadius: 6, font: '600 11px/16px Inter, sans-serif', letterSpacing: '.08em', textTransform: 'uppercase', color: on ? V : CH.muted }}
            onPointerDown={e => e.stopPropagation()} onDoubleClick={e => { e.stopPropagation(); setRenaming(g.flow.id); }}>
            {renaming === g.flow.id
              ? <span style={{ textTransform: 'none', letterSpacing: 0, display: 'inline-flex', width: 160 }}><InlineRename value={g.flow.name} onDone={name => { setRenaming(null); act('upsert_flow', { id: g.flow.id, name }); }} onCancel={() => setRenaming(null)} /></span>
              : <button type="button" title="Inspect the flow (double-click to rename)" onClick={() => setUi(u => ({ ...u, flowId: g.flow.id }))} style={{ font: 'inherit', letterSpacing: 'inherit', textTransform: 'inherit', color: 'inherit', background: 'none', border: 0, padding: 0 }}>{g.flow.name}</button>}
            <span style={{ fontWeight: 400, letterSpacing: 0, textTransform: 'none', color: CH.faint }}>· {n} {unit}{n === 1 ? '' : 's'} · {g.flow.channel}</span>
            <button type="button" className="ac-group-act" title={`Add a ${unit}`} onClick={() => act('upsert_node', { flowId: g.flow.id })}>+ {unit}</button>
            {placed && <button type="button" className="ac-group-act" title="Tidy: return to the automatic layout (⇧T)" onClick={() => act('tidy_flow', { flowId: g.flow.id })}>Tidy</button>}
          </div>
        </div>
      </div>
    );
  });
}

// ---- Diagram layer (§8.5): the draw shapes live in the diagram group of the canvas ----
const DRAW_SHAPE_TOOLS = ['rect', 'ellipse', 'line', 'arrow', 'text', 'pen'];

// useDrawTools: creation, move and resize gestures for shapes, in diagram coordinates (world minus origin).
function useDrawTools({ tool, origin, tokens, shapes, sel }) {
  const { act, viewport } = useS();
  const [creating, setCreating] = useState(null);
  const [override, setOverride] = useState(null); // shape being moved/resized (local until release)
  const [textAt, setTextAt] = useState(null);
  const originRef = useLatest(origin);
  const toDiagram = useCallback((cx, cy) => { const w = viewport.toWorld(cx, cy); const o = originRef.current; return { x: w.x - o.x, y: w.y - o.y }; }, [viewport, originRef]);
  const track = (onMove, onUp) => {
    const move = ev => onMove(ev);
    const up = ev => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); onUp(ev); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  // pointer down on empty canvas with a shape tool
  const onCanvasDown = e => {
    if (e.button !== 0 || textAt || !DRAW_SHAPE_TOOLS.includes(tool)) return false;
    e.preventDefault();
    const w = toDiagram(e.clientX, e.clientY);
    const snapOn = !e.altKey;
    const sx = snap(w.x, snapOn), sy = snap(w.y, snapOn);
    if (tool === 'text') { setTextAt({ x: sx, y: sy }); return true; }
    if (tool === 'pen') {
      let pts = [[Math.round(w.x * 10) / 10, Math.round(w.y * 10) / 10]];
      let lastScreen = [e.clientX, e.clientY];
      setCreating({ type: 'pen', points: pts, stroke: 'ink', sw: 2 });
      track(ev => {
        if (Math.hypot(ev.clientX - lastScreen[0], ev.clientY - lastScreen[1]) < 2) return;
        lastScreen = [ev.clientX, ev.clientY];
        const q = toDiagram(ev.clientX, ev.clientY);
        pts = [...pts, [Math.round(q.x * 10) / 10, Math.round(q.y * 10) / 10]];
        setCreating({ type: 'pen', points: pts, stroke: 'ink', sw: 2 });
      }, () => {
        const simp = pts.filter((q, i) => i === 0 || i === pts.length - 1 || Math.hypot(q[0] - pts[i - 1][0], q[1] - pts[i - 1][1]) >= 1.5);
        setCreating(null);
        if (simp.length >= 2) act('add_shape', { shape: { type: 'pen', points: simp, stroke: 'ink', sw: 2 } });
      });
      return true;
    }
    const make = (ev, alt) => {
      const q = toDiagram(ev.clientX, ev.clientY);
      const ex = snap(q.x, !alt), ey = snap(q.y, !alt);
      if (tool === 'line' || tool === 'arrow') return { type: tool, x1: sx, y1: sy, x2: ex, y2: ey, stroke: 'ink', sw: 1.5 };
      return { type: tool, x: Math.min(sx, ex), y: Math.min(sy, ey), w: Math.abs(ex - sx), h: Math.abs(ey - sy), stroke: 'ink', fill: 'none', sw: 1.5 };
    };
    let last = make(e, e.altKey);
    setCreating(last);
    track(ev => { last = make(ev, ev.altKey); setCreating(last); }, () => {
      setCreating(null);
      const big = last.type === 'line' || last.type === 'arrow' ? Math.hypot(last.x2 - last.x1, last.y2 - last.y1) > 2 : last.w > 2 && last.h > 2;
      if (big) act('add_shape', { shape: last });
    });
    return true;
  };
  const onShapeDown = (e, s) => {
    if (tool !== 'select' || e.button !== 0) return;
    e.stopPropagation();
    if (!sel || sel.shapeId !== s.id) act('set_selection', { selection: { kind: 'shape', shapeId: s.id } });
    const start = toDiagram(e.clientX, e.clientY);
    let cur = s, moved = false;
    track(ev => {
      const q = toDiagram(ev.clientX, ev.clientY);
      const dx = q.x - start.x, dy = q.y - start.y;
      if (!moved && Math.hypot(dx, dy) * viewport.ref.current.zoom < 3) return;
      moved = true;
      cur = moveShape(s, dx, dy, !ev.altKey);
      setOverride(cur);
    }, () => {
      if (moved) act('update_shape', { shapeId: s.id, patch: geomPatch(cur) }).then(() => setOverride(null));
      else setOverride(null);
    });
  };
  const onHandleDown = (e, s, h) => {
    e.stopPropagation();
    let cur = s;
    track(ev => {
      const q = toDiagram(ev.clientX, ev.clientY);
      const x = snap(q.x, !ev.altKey), y = snap(q.y, !ev.altKey);
      if (s.type === 'line' || s.type === 'arrow') cur = h === 'p1' ? { ...s, x1: x, y1: y } : { ...s, x2: x, y2: y };
      else {
        let x1 = s.x, y1 = s.y, x2 = s.x + s.w, y2 = s.y + s.h;
        if (h.includes('w')) x1 = x; if (h.includes('e')) x2 = x; if (h.includes('n')) y1 = y; if (h.includes('s')) y2 = y;
        cur = { ...s, x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.max(1, Math.abs(x2 - x1)), h: Math.max(1, Math.abs(y2 - y1)) };
      }
      setOverride(cur);
    }, () => { if (cur !== s) act('update_shape', { shapeId: s.id, patch: geomPatch(cur) }).then(() => setOverride(null)); else setOverride(null); });
  };
  return { creating, override, textAt, setTextAt, onCanvasDown, onShapeDown, onHandleDown, toDiagram };
}

function DrawLayer({ origin, zoom, tokens, shapes, sel, tool, draw }) {
  const { act } = useS();
  const { creating, override, textAt, setTextAt, onShapeDown, onHandleDown } = draw;
  const shown = sel && sel.kind === 'shape' ? shapes.find(s => s.id === sel.shapeId) : null;
  const list = shapes.map(s => (override && override.id === s.id ? override : s));
  const selShape = shown ? (override && override.id === shown.id ? override : shown) : null;
  const hs = 8 / zoom, sw = 1.5 / zoom;
  const handles = [];
  if (selShape && tool === 'select') {
    if (selShape.type === 'rect' || selShape.type === 'ellipse') {
      const { x, y, w, h } = selShape;
      [['nw', x, y], ['n', x + w / 2, y], ['ne', x + w, y], ['e', x + w, y + h / 2], ['se', x + w, y + h], ['s', x + w / 2, y + h], ['sw', x, y + h], ['w', x, y + h / 2]]
        .forEach(([k, hx, hy]) => handles.push(<rect key={k} x={hx - hs / 2} y={hy - hs / 2} width={hs} height={hs} fill="#fff" stroke={V} strokeWidth={sw} style={{ cursor: k.length === 2 ? (k === 'nw' || k === 'se' ? 'nwse-resize' : 'nesw-resize') : k === 'n' || k === 's' ? 'ns-resize' : 'ew-resize' }} onPointerDown={e => onHandleDown(e, selShape, k)} />));
    } else if (selShape.type === 'line' || selShape.type === 'arrow') {
      [['p1', selShape.x1, selShape.y1], ['p2', selShape.x2, selShape.y2]].forEach(([k, hx, hy]) => handles.push(<circle key={k} cx={hx} cy={hy} r={hs / 2 + 1 / zoom} fill="#fff" stroke={V} strokeWidth={sw} style={{ cursor: 'move' }} onPointerDown={e => onHandleDown(e, selShape, k)} />));
    }
  }
  const box = selShape && shapeBox(selShape, tokens);
  return (
    <svg data-draw-layer="1" style={{ position: 'absolute', left: origin.x, top: origin.y, width: 1, height: 1, overflow: 'visible', pointerEvents: 'none', zIndex: 2 }}>
      <defs>
        {COLOR_KEYS.map(k => (
          <marker key={k} id={'ah-' + k} viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill={tokens.colors[k]} /></marker>
        ))}
      </defs>
      {list.map(s => (
        <g key={s.id} data-shape-id={s.id} onPointerDown={e => onShapeDown(e, s)} style={{ pointerEvents: tool === 'select' ? 'auto' : 'none', cursor: tool === 'select' ? 'move' : undefined }}>
          <DrawShape s={s} tokens={tokens} />
          {(s.type === 'line' || s.type === 'arrow' || s.type === 'pen') && (
            s.type === 'pen'
              ? <polyline points={s.points.map(q => q.join(',')).join(' ')} fill="none" stroke="transparent" strokeWidth={10 / zoom} />
              : <line x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2} stroke="transparent" strokeWidth={10 / zoom} />
          )}
          {s.type === 'text' && (() => { const b = shapeBox(s, tokens); return <rect x={b.x} y={b.y} width={b.w} height={b.h} fill="transparent" />; })()}
          {(s.type === 'rect' || s.type === 'ellipse') && s.fill === 'none' && <rect x={s.x} y={s.y} width={s.w} height={s.h} fill="transparent" stroke="none" />}
        </g>
      ))}
      {creating && <g opacity=".85"><DrawShape s={creating} tokens={tokens} /></g>}
      {box && <rect x={box.x - 4 / zoom} y={box.y - 4 / zoom} width={box.w + 8 / zoom} height={box.h + 8 / zoom} fill="none" stroke={V} strokeWidth={1 / zoom} strokeDasharray={`${4 / zoom} ${3 / zoom}`} pointerEvents="none" />}
      <g style={{ pointerEvents: 'auto' }}>{handles}</g>
      {textAt && (
        <foreignObject x={textAt.x} y={textAt.y - tokens.type.md.lh} width={420} height={tokens.type.md.lh + 8} style={{ pointerEvents: 'auto' }}>
          <TextPlacer onDone={text => { const at = textAt; setTextAt(null); if (text) act('add_shape', { shape: { type: 'text', x: at.x, y: at.y, text, role: 'md', ink: 'ink' } }); }} tokens={tokens} />
        </foreignObject>
      )}
    </svg>
  );
}

// ---- Pins on the canvas (§10): board pins on artboards, draw pins in the diagram, node pins inside entered artboards ----
// Measures block rects inside an artboard in its own (unscaled) px via offset geometry, so a world transform does not matter.
function useOffsetRects(ref, attr, sig) {
  const [rects, setRects] = useState({});
  useLayoutEffect(() => {
    const c = ref.current && ref.current.closest('[data-art-id]');
    if (!c) return;
    const out = {};
    c.querySelectorAll(`[${attr}]`).forEach(el => { out[el.getAttribute(attr)] = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; });
    setRects(prev => (JSON.stringify(prev) === JSON.stringify(out) ? prev : out));
  }, [ref, attr, sig]);
  return rects;
}

// Pins that live on one artboard: board pins (fractions of the artboard) and node pins (fractions of a block or of the frame).
function ArtboardPins({ node, box, zoom, entered }) {
  const { state, ui, viewport } = useS();
  const p = state.project;
  const ref = useRef(null);
  const rects = useOffsetRects(ref, 'data-block-id', JSON.stringify([node, state.view.breakpoint, p.tokens]));
  const items = p.pins.filter(x => (x.target.type === 'board' || x.target.type === 'node') && x.target.nodeId === node.id && pinVisible(x, state, ui)).map(x => {
    const r = x.target.blockId ? rects[x.target.blockId] : null;
    const frame = x.target.type === 'board' ? { x: 0, y: 0, w: box.w, h: box.h } : (r || { x: 0, y: 0, w: box.w, h: node.kind === 'screen' ? PHONE_H : box.h });
    if (x.target.blockId && !r) return null;
    return {
      pin: x, left: frame.x + x.x * frame.w, top: frame.y + x.y * frame.h,
      coords: (cx, cy) => { const w = viewport.toWorld(cx, cy); return { x: clamp((w.x - box.x - frame.x) / frame.w, 0, 1), y: clamp((w.y - box.y - frame.y) / frame.h, 0, 1) }; },
    };
  }).filter(Boolean);
  return <div ref={ref} style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}><PinsLayer items={items} scale={1 / zoom} /></div>;
}

// The infinite canvas: dot grid, world transform, groups and artboards.
function Canvas({ spaceHeld }) {
  const { state, act, ui, setUi, viewport, canvasRef, canvasApi } = useS();
  const p = state.project, v = state.view, tokens = p.tokens;
  const bp = v.breakpoint;
  const worldRef = useRef(null);
  const idsKey = p.nodes.map(n => n.id).join(',');
  const heights = useArtboardHeights(worldRef, idsKey);
  const layout = useMemo(() => layoutCanvas(p, bp, heights), [p, bp, heights]);
  const { view } = viewport;
  // auto-fit until the person pans or zooms: once on mount, again when measured heights settle
  const autoFit = useRef(!(p.canvas.view && p.canvas.view.zoom));
  const heightsReady = !p.nodes.some(n => n.kind === 'page') || Object.keys(heights).length > 0;
  useEffect(() => {
    if (!autoFit.current || !heightsReady) return;
    // next frame: Tailwind Play injects classes after the commit, so measure once the root has its real box
    requestAnimationFrame(() => { if (autoFit.current) viewport.fitTo(layout.bounds, 80, false); });
  }, [layout.bounds, heightsReady]); // eslint-disable-line
  useEffect(() => {
    const el = canvasRef.current;
    if (!el) return;
    const wheel = e => { autoFit.current = false; viewport.onWheel(e); };
    el.addEventListener('wheel', wheel, { passive: false });
    return () => el.removeEventListener('wheel', wheel);
  }, [viewport.onWheel]); // eslint-disable-line
  const sel = v.selection, entered = v.entered;
  const tool = spaceHeld ? 'hand' : (ui.tool || 'select');
  useEffect(() => {
    canvasApi.current.fitAll = () => { autoFit.current = false; viewport.fitTo(layout.bounds, 80, true); };
    canvasApi.current.fitNode = id => { const b = layout.pos[id]; if (b) { autoFit.current = false; viewport.fitTo(b, 120, true); } };
    canvasApi.current.fitDiagram = () => { autoFit.current = false; viewport.fitTo(layout.diagramBox, 120, true); };
  }, [layout, viewport, canvasApi]);
  const draw = useDrawTools({ tool, origin: layout.diagram, tokens, shapes: p.draw.shapes, sel });
  const [draft, setDraft] = useState(null); // pin being placed: {sx, sy, target, x, y} (screen px + target coords)
  // the Pin tool on an artboard: board pin (not entered) or node pin on a block / the frame (entered)
  const annotateDown = (e, n) => {
    if (e.button !== 0 || e.target.closest('.ac-pin, .ac-pop')) return;
    e.stopPropagation(); e.preventDefault();
    const r = canvasRef.current.getBoundingClientRect();
    const box = layout.pos[n.id];
    const w = viewport.toWorld(e.clientX, e.clientY);
    const sec = entered === n.id ? e.target.closest('[data-block-id]') : null;
    let target, x, y;
    if (entered !== n.id) { target = { type: 'board', nodeId: n.id }; x = (w.x - box.x) / box.w; y = (w.y - box.y) / box.h; }
    else if (sec) { const art = e.target.closest('[data-art-id]'); const sr = sec.getBoundingClientRect(), ar = art.getBoundingClientRect(); target = { type: 'node', nodeId: n.id, blockId: sec.getAttribute('data-block-id') }; x = (e.clientX - sr.left) / sr.width; y = (e.clientY - sr.top) / sr.height; void ar; }
    else { target = { type: 'node', nodeId: n.id }; x = (w.x - box.x) / box.w; y = (w.y - box.y) / (n.kind === 'screen' ? PHONE_H : box.h); }
    setDraft({ left: e.clientX - r.left, top: e.clientY - r.top, target, x: clamp(x, 0, 1), y: clamp(y, 0, 1) });
  };
  const drawPinItems = p.pins.filter(x => x.target.type === 'draw' && pinVisible(x, state, ui)).map(x => ({
    pin: x, left: x.x, top: x.y,
    coords: (cx, cy) => { const q = draw.toDiagram(cx, cy); return { x: Math.round(q.x), y: Math.round(q.y) }; },
  }));
  const [edgeDrag, setEdgeDrag] = useState(null);   // {fromId, x1, y1, x2, y2} world
  const [pending, setPending] = useState(null);     // {fromId, toId, sx, sy} screen
  const onPortDown = (e, n, portY) => {
    if (e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    const a = layout.pos[n.id];
    const start = { fromId: n.id, x1: a.x + a.w, y1: a.y + portY };
    setEdgeDrag({ ...start, x2: start.x1, y2: start.y1 });
    const move = ev => { const w = viewport.toWorld(ev.clientX, ev.clientY); setEdgeDrag(d => d && { ...d, x2: w.x, y2: w.y }); };
    const up = ev => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      setEdgeDrag(null);
      const hit = document.elementsFromPoint(ev.clientX, ev.clientY).map(el => el.closest && el.closest('[data-art-id]')).find(Boolean);
      const toId = hit && hit.getAttribute('data-art-id');
      if (toId && toId !== n.id && layout.pos[toId]) { const r = canvasRef.current.getBoundingClientRect(); setPending({ fromId: n.id, toId, sx: ev.clientX - r.left, sy: ev.clientY - r.top }); }
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  const onDown = e => {
    if (e.button !== 0) return;
    const bg = e.target === e.currentTarget || e.target.closest('[data-canvas-bg]');
    if (tool === 'pin') {
      if (!bg || e.target.closest('.ac-pin, .ac-pop')) return;
      const r = canvasRef.current.getBoundingClientRect(), q = draw.toDiagram(e.clientX, e.clientY);
      setDraft({ left: e.clientX - r.left, top: e.clientY - r.top, target: { type: 'draw' }, x: Math.round(q.x), y: Math.round(q.y) });
      return;
    }
    if (bg && draw.onCanvasDown(e)) return;
    if (tool === 'hand' || (tool === 'select' && bg)) {
      e.preventDefault();
      const sx = e.clientX, sy = e.clientY, o = viewport.ref.current;
      let moved = false;
      const move = ev => { if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 3) return; moved = true; autoFit.current = false; viewport.set(() => ({ ...o, x: o.x + ev.clientX - sx, y: o.y + ev.clientY - sy }), false); };
      const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); if (moved) viewport.set(x => x, true); else if (bg && v.selection && tool === 'select') act('set_selection', { selection: null }); };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    }
  };
  let step = 24 * view.zoom; while (step < 14) step *= 2;
  const gridOpacity = clamp((view.zoom - 0.2) / 0.15, 0, 1);
  const cursor = tool === 'hand' ? 'grab' : tool === 'select' ? 'default' : tool === 'text' ? 'text' : 'crosshair';
  return (
    <div ref={canvasRef} data-canvas="1" style={{ position: 'absolute', inset: 0, overflow: 'hidden', userSelect: 'none', background: CH.backdrop, cursor, touchAction: 'none' }} onPointerDownCapture={() => { autoFit.current = false; }} onPointerDown={onDown}>
      <div data-canvas-bg="1" style={{ position: 'absolute', inset: 0, opacity: gridOpacity, backgroundImage: 'radial-gradient(var(--ac-dot) 1px, transparent 1.2px)', backgroundSize: `${step}px ${step}px`, backgroundPosition: `${view.x}px ${view.y}px` }} />
      <div ref={worldRef} className={viewport.anim ? 'ac-zoomanim' : ''} style={{ position: 'absolute', left: 0, top: 0, transform: `translate(${view.x}px, ${view.y}px) scale(${view.zoom})`, transformOrigin: '0 0', willChange: 'transform' }}>

    act('set_selection', { selection: childId ? { kind: 'block', nodeId, blockId, childId } : { kind: 'block', nodeId, blockId } });
  }, [act, stRef]);

  // drag the block chip to reorder (one history step on release)
  const onChipDown = useCallback((e, blockId) => {
    const frame = frameRef.current;
    if (!frame) return;
    const n = findNode(stRef.current.project, node.id);
    const ids = n.blocks.map(b => b.id);
    const from = ids.indexOf(blockId);
    let index = from;
    const move = ev => {
      const fr = frame.getBoundingClientRect();
      const secs = [...frame.querySelectorAll('section[data-block-id]')];
      let i = secs.length, y = 0;
      for (let k = 0; k < secs.length; k++) { const r = secs[k].getBoundingClientRect(); if (ev.clientY < r.top + r.height / 2) { i = k; break; } }
      if (i < secs.length) y = secs[i].getBoundingClientRect().top - fr.top; else if (secs.length) y = secs[secs.length - 1].getBoundingClientRect().bottom - fr.top;
      index = i;
      setDrop({ index: i, y });
    };
    const up = () => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      setDrop(null);
      let to = index > from ? index - 1 : index;
      if (to !== from && to >= 0) {
        const next = ids.filter(x => x !== blockId);
        next.splice(to, 0, blockId);
        act('reorder_blocks', { nodeId: node.id, blockIds: next });

    const box = (sec || frameRef.current).getBoundingClientRect();
    const target = sec ? { type: 'node', nodeId: node.id, blockId: sec.getAttribute('data-block-id') } : { type: 'node', nodeId: node.id };
    setDraft({ left: e.clientX - fr.left, top: e.clientY - fr.top, target, x: (e.clientX - box.left) / box.width, y: (e.clientY - box.top) / box.height });
  };

  const frameW = frameRef.current ? frameRef.current.offsetWidth : BREAKPOINTS[bp];
  const frameH = frameRef.current ? frameRef.current.offsetHeight : 0;
  const pinItems = p.pins.filter(x => x.target.type === 'node' && x.target.nodeId === node.id && pinVisible(x, state, ui)).map(x => {

    };
  }).filter(it => it.pin.target.blockId ? rects[it.pin.target.blockId] : true);

  const ctx = { tokens: p.tokens, bp, mode: 'edit', nodeId: node.id, selection: sel, onSelect, showSpecs: v.showSpecs, onChipDown };
  return (
    <div ref={scrollRef} className="absolute inset-0 overflow-auto ac-scroll" onClick={() => { if (sel && !ui.annotate) act('set_selection', { selection: null }); }}>
      <div className="py-8 px-6 min-w-max">

          <span>{(findFlow(p, node.flowId) || {}).name} › <b className="text-[#232220]">{node.name}</b></span><span>{BREAKPOINTS[bp]}px</span>
        </div>
        <div ref={frameRef} className={'ac-frame ac-edit relative mx-auto shadow-[0_10px_40px_rgba(28,27,25,.18)] ' + (ui.annotate ? 'ac-annotate' : '')}
          style={{ width: BREAKPOINTS[bp], background: p.tokens.colors.paper, minHeight: 240 }}
          onClickCapture={onAnnotate} onClick={e => { e.stopPropagation(); if (!ui.annotate) act('set_selection', { selection: { kind: 'node', nodeId: node.id } }); }}>
          {node.blocks.map(b => renderBlock(b, ctx))}

function shapeBox(s, tokens) {
  if (s.type === 'rect' || s.type === 'ellipse') return { x: s.x, y: s.y, w: s.w, h: s.h };
  if (s.type === 'line' || s.type === 'arrow') return { x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2), w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1) };
  if (s.type === 'text') { const t = tokens.type[s.role] || tokens.type.md; return { x: s.x, y: s.y - t.size * 0.82, w: Math.max(8, s.text.length * t.size * 0.52), h: t.lh }; }
  const xs = s.points.map(q => q[0]), ys = s.points.map(q => q[1]);
  return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
}

function DrawShape({ s, tokens }) {
  const stroke = col(tokens, s.stroke);
  if (s.type === 'rect') return <rect x={s.x} y={s.y} width={s.w} height={s.h} stroke={stroke} fill={col(tokens, s.fill)} strokeWidth={s.sw} />;
  if (s.type === 'ellipse') return <ellipse cx={s.x + s.w / 2} cy={s.y + s.h / 2} rx={s.w / 2} ry={s.h / 2} stroke={stroke} fill={col(tokens, s.fill)} strokeWidth={s.sw} />;
  if (s.type === 'line' || s.type === 'arrow') return <line x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2} stroke={stroke} strokeWidth={s.sw} strokeLinecap="round" markerEnd={s.type === 'arrow' ? `url(#ah-${s.stroke})` : undefined} />;
  // SPEC: a text shape's (x, y) is its baseline, matching the SVG export.
  if (s.type === 'text') { const t = tokens.type[s.role] || tokens.type.md; return <text x={s.x} y={s.y} fill={col(tokens, s.ink)} style={{ fontFamily: SERIF, fontSize: t.size, fontWeight: t.weight }}>{s.text}</text>; }
  return <polyline points={s.points.map(q => q.join(',')).join(' ')} fill="none" stroke={stroke} strokeWidth={s.sw} strokeLinecap="round" strokeLinejoin="round" />;
}

function moveShape(s, dx, dy, snapOn) {
  if (s.type === 'line' || s.type === 'arrow') {
    const nx = snap(s.x1 + dx, snapOn), ny = snap(s.y1 + dy, snapOn);
    const ddx = nx - s.x1, ddy = ny - s.y1;
    return { ...s, x1: nx, y1: ny, x2: s.x2 + ddx, y2: s.y2 + ddy };
  }
  if (s.type === 'pen') return { ...s, points: s.points.map(q => [q[0] + dx, q[1] + dy]) }; // pen never snaps
  return { ...s, x: snap(s.x + dx, snapOn), y: snap(s.y + dy, snapOn) };
}
const geomPatch = s => (s.type === 'line' || s.type === 'arrow') ? { x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2 }
  : s.type === 'pen' ? { points: s.points } : s.type === 'text' ? { x: s.x, y: s.y } : { x: s.x, y: s.y, w: s.w, h: s.h };

function TextPlacer({ onDone, tokens }) {
  const [d, setD] = useState('');
  const done = useRef(false);
  const finish = v => { if (done.current) return; done.current = true; onDone(v); };
  const t = tokens.type.md;

      onBlur={() => finish(d.trim())}
      style={{ width: 400, height: t.lh + 4, font: `${t.weight} ${t.size}px ${SERIF}`, background: 'rgba(251,248,242,.9)', border: `1px dashed ${V}`, outline: 'none', padding: '0 2px', color: tokens.colors.ink }} />
  );

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.warn('AgentCanvas UI error', error, info && info.componentStack); }
  reset = async () => {
    if (!window.confirm('Start over with a blank project? Your current project is replaced.')) return;
    try { await fetch('/api/act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'reset_project', payload: {} }) }); } catch (e) { /* reload anyway */ }
    window.location.reload();
  };
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div className="h-full flex items-center justify-center bg-[#E7E0D2] font-ui">
        <div className="max-w-[480px] bg-[#FBF8F2] border border-[#DDD5C4] rounded p-6 shadow-lg">
          <div className="font-serif text-[22px] mb-2">The studio hit an error</div>

          <div className="flex gap-2">

        </div>

    );
  }
}

function App() {
  const studio = useStudio();

  const canvasApi = useRef({});
  const addNodeRef = useRef(() => {});
  const [spaceHeld, setSpaceHeld] = useState(false);
  const docRef = useRef({});
  const navRef = useRef(null);
  const stRef = useLatest(state), uiRef = useLatest(ui);

  // canvas viewport: local while interacting, persisted with set_canvas_view (debounced)
  const canvasRef = useRef(null);
  const commitView = useCallback(next => act('set_canvas_view', next), [act]);
  const viewport = useViewport(canvasRef, state ? state.project.canvas.view : null, commitView);

  // a new selection closes the flow and tokens views so the inspector follows it
  const selKey = state && state.view.selection ? JSON.stringify(state.view.selection) : '';
  useEffect(() => { if (selKey) setUi(u => (u.flowId || u.tokensOpen ? { ...u, flowId: null, tokensOpen: false } : u)); }, [selKey]);

  // leaving the draw tab or a mode resets transient local UI
  const tab = state ? state.view.tab : 'web';
  useEffect(() => { setUi(u => (u.tool !== 'select' ? { ...u, tool: 'select' } : u)); }, [tab]);

  // one keydown listener on window (§11.1)
  useEffect(() => {
    const onKey = e => {
      const st = stRef.current; if (!st) return;
      const u = uiRef.current, v = st.view, sel = v.selection;
      const active = document.activeElement;
      const typing = isTyping(active);
      const mod = e.metaKey || e.ctrlKey;
      if (mod && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        const h = st.history[v.tab] || {};
        const canDo = e.shiftKey ? h.canRedo : h.canUndo;
        const el = typing ? active : null;
        // nothing to do: say so locally instead of sending a request the server would refuse
        if (!canDo && !el) { studio.showToast(e.shiftKey ? 'Nothing to redo in this tab.' : 'Nothing to undo in this tab.'); return; }
        if (el) el.blur(); // flush the open text draft so undo reverts the whole burst
        act(e.shiftKey ? 'redo' : 'undo', { tab: v.tab }).then(() => { if (el && document.contains(el)) el.focus(); });
        return;
      }
      if (e.key === 'Escape') {
        if (v.preview) { act('set_preview', { on: false }); return; }
        if (typing) { active.blur(); return; }
        if (u.skillsOpen) { setUi(x => ({ ...x, skillsOpen: false })); return; }
        if (u.tool !== 'select') { setUi(x => ({ ...x, tool: 'select' })); return; }
        if (u.flowId) { setUi(x => ({ ...x, flowId: null })); return; }
        if (sel) act('set_selection', { selection: null });
        return;
      }
      if (typing) return;
      if (v.preview) {
        if (e.key === 'ArrowLeft' && navRef.current) { e.preventDefault(); navRef.current.back(); }
        if (e.key === 'ArrowRight' && navRef.current) { e.preventDefault(); navRef.current.forward(); }
        return;
      }
      if (v.tab !== 'doc') {
        if (e.key === ' ') { e.preventDefault(); if (!e.repeat) setSpaceHeld(true); return; }
        if (mod && e.key === '0') { e.preventDefault(); if (canvasApi.current.fitAll) canvasApi.current.fitAll(); return; }
        const keyTool = { v: 'select', h: 'hand', r: 'rect', o: 'ellipse', l: 'line', a: 'arrow', t: 'text', p: 'pen', c: 'pin' }[e.key];
        if (keyTool && !mod && !e.altKey) { setUi(x => ({ ...x, tool: keyTool })); return; }
        if ((e.key === 'n' || e.key === 'm') && !mod && !e.altKey) { e.preventDefault(); addNodeRef.current(e.key === 'n' ? 'web' : 'mobile'); return; }
        if (e.key === 'T' && e.shiftKey && !mod) { e.preventDefault(); const rail = document.querySelector('[data-tool="tidy"]'); if (rail) rail.click(); return; }
        if (mod && e.key === '1') { e.preventDefault(); const c = canvasApi.current; if (sel && sel.nodeId) { if (v.entered !== sel.nodeId) act('set_entered', { nodeId: sel.nodeId }); if (c.fitNode) c.fitNode(sel.nodeId); } else if (sel && sel.kind === 'shape' && c.fitDiagram) c.fitDiagram(); else if (c.fitAll) c.fitAll(); return; }
        if (e.key === 'Enter' && sel && sel.kind === 'node' && v.entered !== sel.nodeId) { e.preventDefault(); act('set_entered', { nodeId: sel.nodeId }); if (canvasApi.current.fitNode) canvasApi.current.fitNode(sel.nodeId); return; }
      }
      if (mod && e.key === '.') { e.preventDefault(); setUi(x => ({ ...x, inspectorOpen: x.inspectorOpen === false })); return; }
      if (mod && e.key === '\\') { e.preventDefault(); setUi(x => ({ ...x, leftOpen: !x.leftOpen })); return; }
      if (mod && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); setUi(x => ({ ...x, leftOpen: true })); requestAnimationFrame(() => { const el = document.querySelector('[data-prompt]'); if (el) el.focus(); }); return; }
      if (mod && (e.key === 'd' || e.key === 'D')) {
        e.preventDefault();
        if (sel && sel.kind === 'block') act('duplicate_block', { nodeId: sel.nodeId, blockId: sel.blockId });
        if (sel && sel.kind === 'shape') act('duplicate_shape', { shapeId: sel.shapeId });
        return;
      }
      if ((e.key === 'Delete' || e.key === 'Backspace') && sel) {
        e.preventDefault();
        const p = st.project;
        if (sel.kind === 'block') {
          const n = findNode(p, sel.nodeId), b = n && n.blocks.find(x => x.id === sel.blockId);
          if (!b) return;
          if (!sel.childId) act('delete_block', { nodeId: sel.nodeId, blockId: sel.blockId });
          else if (b.secondary && b.secondary.id === sel.childId) act('update_block', { nodeId: n.id, blockId: b.id, patch: { secondary: null } });
          else if ((b.links || []).some(l => l.id === sel.childId) || (b.items || []).some(i => i.id === sel.childId)) act('delete_child', { nodeId: sel.nodeId, blockId: sel.blockId, childId: sel.childId });
          else act('delete_block', { nodeId: sel.nodeId, blockId: sel.blockId });
        } else if (sel.kind === 'hotspot') act('delete_hotspot', { nodeId: sel.nodeId, hotspotId: sel.hotspotId });
        else if (sel.kind === 'shape') act('delete_shape', { shapeId: sel.shapeId });
        else if (sel.kind === 'edge') act('delete_edge', { edgeId: sel.edgeId });
        else if (sel.kind === 'pin') act('delete_pin', { pinId: sel.pinId });
        else if (sel.kind === 'node') {
          const n = findNode(p, sel.nodeId);
          const onBoard = (v.tab === 'web' && v.view.web === 'board') || (v.tab === 'story' && v.view.story === 'board');
          if (!n || !onBoard) return;
          const pins = p.pins.filter(x => x.target.nodeId === n.id).length;
          const has = (n.kind === 'page' ? n.blocks.length : 1) + pins;
          if (!has || window.confirm(`Delete "${n.name}"? Its edges${pins ? ` and ${pins} pin(s)` : ''} go with it.`)) act('delete_node', { nodeId: n.id });
        }
      }
    };
    const onUp = e => { if (e.key === ' ') setSpaceHeld(false); };
    const onBlur = () => setSpaceHeld(false);
    window.addEventListener('keydown', onKey);
    window.addEventListener('keyup', onUp);
    window.addEventListener('blur', onBlur);
    return () => { window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', onUp); window.removeEventListener('blur', onBlur); };
  }, [act, stRef, uiRef, studio.showToast]);

  if (!state) {
    return <div className="h-full flex items-center justify-center font-ui text-[#6B665C]">{conn === 'reconnecting' ? 'Reconnecting to the AgentCanvas server…' : 'Connecting…'}</div>;
  }
  const ctx = { ...studio, ui, setUi, docRef, viewport, canvasRef, canvasApi };
  const v = state.view;
  const editor = v.tab === 'doc' ? <DesignDoc /> : <Canvas spaceHeld={spaceHeld} />;
  return (
    <Studio.Provider value={ctx}>
      <KeyboardBridge addNodeRef={addNodeRef} />
      <div className="h-full flex flex-col font-ui">
        <TopBar />
        <div className="flex-1 min-h-0 flex relative">
          <main className="flex-1 min-w-0 relative" style={{ background: CH.backdrop }}>
            {v.tab === 'doc' ? <div style={{ position: 'absolute', inset: 0, left: ui.leftOpen ? 300 : 68 }}>{editor}</div> : editor}
            {v.tab !== 'doc' && isUntouched(state.project) && <EmptyCanvas />}
            <LeftPanel />
            {v.tab !== 'doc' && <><ToolRail /><ZoomPill /><HintStrip /></>}
            <Inspector />
            {ui.skillsOpen && <SkillsDrawer />}
            {toast && <Toast msg={toast.msg} />}
          </main>
          {conn !== 'live' && <div title="Reconnecting… editing is paused" className="absolute inset-0 z-[80] cursor-not-allowed" style={{ background: 'rgba(231,224,210,.45)' }} />}
        </div>
        {v.preview && <PreviewStage navRef={navRef} />}
      </div>
    </Studio.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
