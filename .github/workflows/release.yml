name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, tag, and publish (for example v0.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Tag pushes use the tag name; manual runs use the input. Passed through env, never
      # interpolated into shell, so the input cannot inject commands.
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - name: Validate version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Version must look like v1.2.3 or v1.2.3-rc.1 (got: $VERSION)"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify vendored assets
        run: make vendor-verify

      - name: Vet and test
        run: make test

      - name: Build six binaries
        run: make release VERSION="$VERSION"

      - name: Check the version is stamped
        run: ./dist/agent-canvas-linux-amd64 version | grep -F "$VERSION"

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum agent-canvas-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" dist/agent-canvas-* dist/SHA256SUMS --clobber
          else
            gh release create "$VERSION" dist/agent-canvas-* dist/SHA256SUMS \
              --title "AgentCanvas $VERSION" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: agent-canvas-${{ env.VERSION }}
          path: |
            dist/agent-canvas-*
            dist/SHA256SUMS
          if-no-files-found: error

  verify-installers:
    name: Installer (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: One-line installer (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export AGENT_CANVAS_INSTALL_DIR="$RUNNER_TEMP/bin" AGENT_CANVAS_VERSION="$VERSION"
          sh docs/install.sh
          "$AGENT_CANVAS_INSTALL_DIR/agent-canvas" version | grep -F "$VERSION"
          "$AGENT_CANVAS_INSTALL_DIR/agent-canvas" update --check | tee check.txt
          grep -F "$VERSION is up to date" check.txt
          sh docs/install.sh   # re-running updates in place
          "$AGENT_CANVAS_INSTALL_DIR/agent-canvas" version | grep -F "$VERSION"

      - name: init and open in a fresh project (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          AC="$RUNNER_TEMP/bin/agent-canvas"
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj" && git init -q .
          "$AC" init
          test -f .agentcanvas/project.json && test -f .claude/skills/agentcanvas/SKILL.md && test -f .agents/skills/agentcanvas/SKILL.md
          grep -F '"--start"' .mcp.json && grep -F '[mcp_servers.agentcanvas]' .codex/config.toml && grep -F '.agentcanvas/server.json' .gitignore
          "$AC" open --no-browser | tee open.txt
          ui=$(sed -n 's/^UI:  //p' open.txt); curl -fsS "${ui}healthz"
          "$AC" open --no-browser | grep -F "$ui"   # reuses the running studio
          kill "$(python3 -c 'import json;print(json.load(open(".agentcanvas/server.json"))["pid"])')"

      - name: One-line installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AGENT_CANVAS_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          $env:AGENT_CANVAS_VERSION = $env:VERSION
          Get-Content -Raw docs/install.ps1 | Invoke-Expression
          $exe = Join-Path $env:AGENT_CANVAS_INSTALL_DIR 'agent-canvas.exe'
          $v = & $exe version
          if ($v -notmatch [regex]::Escape($env:VERSION)) { throw "unexpected version: $v" }
          $c = & $exe update --check
          if ($c -notmatch 'is up to date') { throw "unexpected update check: $c" }
          Get-Content -Raw docs/install.ps1 | Invoke-Expression   # re-running updates in place
          & $exe version

      - name: init and open in a fresh project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path (Join-Path $env:RUNNER_TEMP 'bin') 'agent-canvas.exe'
          $proj = Join-Path $env:RUNNER_TEMP 'proj'
          New-Item -ItemType Directory -Force -Path $proj | Out-Null
          Set-Location $proj
          git init -q .
          & $exe init
          if ($LASTEXITCODE -ne 0) { throw "init failed" }
          foreach ($f in '.agentcanvas/project.json', '.claude/skills/agentcanvas/SKILL.md', '.agents/skills/agentcanvas/SKILL.md', '.mcp.json', '.codex/config.toml') {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
          $out = & $exe open --no-browser
          if ($LASTEXITCODE -ne 0) { throw "open failed: $out" }
          $ui = (($out | Select-String '^UI:  ').Line -replace '^UI:  ', '')
          Invoke-WebRequest -UseBasicParsing -Uri ($ui + 'healthz') | Out-Null
          $again = & $exe open --no-browser
          if (-not ($again -match [regex]::Escape($ui))) { throw "second open started another studio: $again" }
          $info = Get-Content .agentcanvas/server.json | ConvertFrom-Json
          Stop-Process -Id $info.pid -Force
